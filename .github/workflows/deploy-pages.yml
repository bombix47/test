name: Deploy to GitHub Pages

on:
  push:
    branches: [master, claude/artist-portfolio-app-6oasfp]
    paths: ['portfolio/**', 'bigData.html', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: portfolio/package-lock.json
      # Prérequis manuel : Settings → Pages → Source = "GitHub Actions".
      # En mode "Deploy from a branch", le build Jekyll de la branche écrase ce déploiement.
      - uses: actions/configure-pages@v5
      - run: npm ci
      # Le site est servi sous https://<owner>.github.io/<repo>/
      - run: npm run build:pages
        env:
          PAGES_BASE_HREF: /${{ github.event.repository.name }}/
      # Conserve la page existante à la racine du site
      - run: cp ../bigData.html dist/portfolio/browser/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio/dist/portfolio/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Deploy to GitHub Pages

on:
  push:
    branches: [master, claude/artist-portfolio-app-6oasfp]
    paths: ['portfolio/**', 'bigData.html', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: portfolio/package-lock.json
      # Bascule la source Pages sur "GitHub Actions" (sinon le build Jekyll de la branche écrase ce déploiement)
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Force Pages build_type=workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}')
          echo "PUT /pages -> $code"; cat /tmp/pages.json; echo
          curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" | grep -o '"build_type":"[a-z]*"' || true
      - run: npm ci
      # Le site est servi sous https://<owner>.github.io/<repo>/
      - run: npm run build:pages
        env:
          PAGES_BASE_HREF: /${{ github.event.repository.name }}/
      # Conserve la page existante à la racine du site
      - run: cp ../bigData.html dist/portfolio/browser/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio/dist/portfolio/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

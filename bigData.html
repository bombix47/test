<style>
:root{
  --f:#1d4ed8; --f-bg:#eff6ff;
  --c:#c2410c; --c-bg:#fff7ed;
  --b:#6d28d9; --b-bg:#f5f3ff;
  --n:#94a3b8;
  --ink:#0f172a; --ink2:#475569; --ink3:#64748b;
  --bg:#f1f5f9; --card:#ffffff; --line:#e2e8f0;
  --hdr:#0f172a;
  --r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font:400 15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink); background:var(--bg);
  -webkit-text-size-adjust:100%;
}
#app{max-width:520px;margin:0 auto;background:var(--bg);min-height:100vh;position:relative}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:var(--f)}

/* ---------- profil ---------- */
#gate{
  position:fixed;inset:0;z-index:100;background:var(--hdr);color:#fff;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
  text-align:center;
}
#gate.hide{display:none}
#gate h1{font-size:22px;margin:0 0 4px;font-weight:700}
#gate .sub{font-size:14px;color:#94a3b8;margin:0 0 30px;max-width:300px;line-height:1.5}
#gate .who{font-size:16px;color:#cbd5e1;margin:0 0 14px;font-weight:600}
.gate-btn{
  width:100%;max-width:320px;min-height:60px;border-radius:14px;
  font-size:17px;font-weight:700;color:#fff;margin-bottom:12px;
  display:flex;align-items:center;justify-content:center;gap:10px;
}
.gate-btn small{font-weight:400;font-size:13px;opacity:.85}
.gate-btn.f{background:var(--f)} .gate-btn.c{background:var(--c)}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:30;background:var(--hdr);color:#fff;
  /* env() vaut 0 hors mode installé : sans effet dans un navigateur classique */
  padding:calc(10px + env(safe-area-inset-top)) 12px 0;
}
.hrow{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.htitle{font-size:14px;font-weight:700;line-height:1.2;flex:1;min-width:0}
.htitle span{display:block;font-size:11px;font-weight:400;color:#94a3b8;letter-spacing:.02em}
#profBtn{
  min-height:44px;padding:6px 13px 6px 8px;border-radius:999px;font-size:13px;font-weight:700;
  display:flex;align-items:center;gap:7px;background:#1e293b;color:#fff;flex:none;
}
#badgeBtn{
  min-height:44px;padding:6px 12px 6px 9px;border-radius:999px;background:#1e293b;color:#fff;
  font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px;flex:none;
}
#badgeBtn.hide{display:none}
.bq{
  flex:none;width:16px;height:16px;display:grid;grid-template:1fr 1fr / 1fr 1fr;gap:3px;
}
.bq i{display:block;border-radius:2px;background:#fff}
.bq i:nth-child(4){background:#64748b}

#badgeBody{padding-bottom:calc(18px + env(safe-area-inset-bottom));text-align:center}
.badge-img{
  display:block;width:100%;height:auto;max-width:330px;margin:0 auto;border-radius:12px;
  box-shadow:0 2px 16px rgba(15,23,42,.18);
}
/* écrans courts : le QR doit rester visible sans faire défiler la fiche */
@media (max-height:720px){ .badge-img{max-width:250px} }
.badge-id{
  font:700 13.5px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color:var(--ink2);margin:14px 0 0;word-break:break-all;
  -webkit-user-select:all;user-select:all;
}
.badge-tip{
  font-size:12.5px;line-height:1.45;color:var(--ink3);margin:10px auto 0;max-width:300px;
}
#profBtn .av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff}
body[data-profile="F"] #profBtn .av{background:var(--f)}
body[data-profile="C"] #profBtn .av{background:var(--c)}

.tabs{display:flex;gap:2px}
.tab{
  flex:1;min-height:46px;padding:7px 4px;border-radius:10px 10px 0 0;
  font-size:13px;font-weight:600;color:#94a3b8;background:transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25;
}
.tab small{font-size:10px;font-weight:400;opacity:.85}
.tab[aria-selected="true"]{background:var(--bg);color:var(--ink)}
.tab .badge{
  display:inline-block;min-width:17px;padding:0 5px;border-radius:999px;
  font-size:10px;font-weight:800;color:#fff;margin-left:5px;vertical-align:1px;
}
body[data-profile="F"] .tab .badge{background:var(--f)}
body[data-profile="C"] .tab .badge{background:var(--c)}

/* ---------- filtres ---------- */
#filters{
  position:sticky;top:var(--hdrH,96px);z-index:29;background:var(--bg);
  padding:10px 12px 8px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;
}
#filters.hide{display:none}
#chips{
  flex:1;min-width:0;display:flex;align-items:center;gap:6px;
  overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  padding:2px 0;
}
#chips::-webkit-scrollbar{display:none}
.chip{
  min-height:44px;padding:7px 14px;border-radius:999px;background:#fff;
  border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink2);
  white-space:nowrap;flex:none;
}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.rec[aria-pressed="true"]{background:#b45309;border-color:#b45309}
#count{flex:none;font-size:12px;font-weight:800;color:var(--ink3);white-space:nowrap;text-align:right;line-height:1.15}
#count b{display:block;font-size:15px;color:var(--ink);letter-spacing:-.02em}

/* ---------- timeline ---------- */
main{padding:12px 12px 40px}
.slot{display:flex;gap:10px}
.slot-time{flex:none;width:52px;padding-top:2px;text-align:right}
.slot-time b{font-size:13px;font-weight:800;color:var(--ink);display:block;letter-spacing:-.02em}
.slot-time i{font-size:10px;font-style:normal;color:var(--n);display:block;margin-top:1px;white-space:nowrap}
.slot-rail{flex:none;width:12px;position:relative}
.slot-rail::before{content:"";position:absolute;left:5px;top:0;bottom:0;width:2px;background:var(--line)}
.slot:last-child .slot-rail::before{bottom:auto;height:22px}
.slot-rail::after{content:"";position:absolute;left:1px;top:6px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--n)}
.slot-cards{flex:1;min-width:0;padding-bottom:14px;display:flex;flex-direction:column;gap:8px}

/* ---------- carte ---------- */
.card{
  display:flex;align-items:stretch;background:var(--card);border-radius:var(--r);
  border:1px solid var(--line);border-left:4px solid var(--n);overflow:hidden;
  box-shadow:0 1px 2px rgba(15,23,42,.05);
}
.card.o-F{border-left-color:var(--f)} .card.o-C{border-left-color:var(--c)} .card.o-B{border-left-color:var(--b)}
.card-main{flex:1;min-width:0;text-align:left;padding:10px 4px 10px 11px;min-height:44px}
.meta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:5px}
.tag{
  font-size:10px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;
  padding:2px 6px;border-radius:5px;background:#f1f5f9;color:var(--ink3);
}
.tag.conf{background:#e0e7ff;color:#3730a3}
.tag.ws{background:#dcfce7;color:#166534}
.tag.room{background:#f1f5f9;color:var(--ink2)}
.tag.star{background:#fef3c7;color:#92400e}
.tag.rec{background:#fff7ed;color:#b45309;box-shadow:inset 0 0 0 1px #fed7aa}
.card h3{font-size:14.5px;line-height:1.3;margin:0;font-weight:650;letter-spacing:-.01em}
.spons{font-size:12px;color:var(--ink3);margin-top:4px}
.spons b{font-weight:650;color:var(--ink2)}
.hours{font-size:11px;color:var(--ink3);margin-top:3px}

.card-check{
  flex:none;width:48px;min-height:48px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;border-left:1px solid var(--line);
}
.card-check .box{
  width:24px;height:24px;border-radius:7px;border:2px solid #cbd5e1;background:#fff;
  display:grid;place-items:center;font-size:14px;font-weight:900;color:transparent;line-height:1;
}
.card-check .dot{width:6px;height:6px;border-radius:50%;background:transparent}

.card.sel{border-color:transparent}
body[data-profile="F"] .card.sel{background:var(--f-bg);box-shadow:0 0 0 2px var(--f)}
body[data-profile="C"] .card.sel{background:var(--c-bg);box-shadow:0 0 0 2px var(--c)}
body[data-profile="F"] .card.sel .card-check .box{background:var(--f);border-color:var(--f);color:#fff}
body[data-profile="C"] .card.sel .card-check .box{background:var(--c);border-color:var(--c);color:#fff}
body[data-profile="F"] .card.other .card-check .dot{background:var(--c)}
body[data-profile="C"] .card.other .card-check .dot{background:var(--f)}
.card.sel .card-check{border-left-color:rgba(15,23,42,.08)}

/* ---------- mon planning ---------- */
#planning{padding:12px 12px 48px}
.pl-head{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.pl-head strong{display:block;font-size:16px;letter-spacing:-.01em}
.pl-head p{margin:4px 0 0;font-size:13px;color:var(--ink3)}
.pl-day{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin:18px 0 8px}
.pl-day span{font-weight:600;text-transform:none;letter-spacing:0;color:var(--n)}
.pl-row{
  display:flex;gap:10px;background:#fff;border:1px solid var(--line);
  border-left:4px solid var(--n);border-radius:10px;padding:9px 10px;margin-bottom:6px;
  text-align:left;width:100%;min-height:48px;align-items:center;
}
.pl-row.o-F{border-left-color:var(--f)} .pl-row.o-C{border-left-color:var(--c)} .pl-row.o-B{border-left-color:var(--b)}
.pl-row.none{border-left-color:var(--line);color:var(--ink3);font-size:13px;justify-content:center}
.pl-t{flex:none;width:46px}
.pl-t b{display:block;font-size:13px;font-weight:800;letter-spacing:-.02em}

<script type="application/json" id="sessions-data">[{"id":"262650","type":"conference","day":1,"title":"Au-delà de l'adoption : réussir l'intégration stratégique de l'IA en entreprise","time_start":"09:50","time_end":"10:20","room":"C1","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262650.x.html","curated":true,"owner":"B","top":false,"description":"Au cours des deux dernières années, l'IA est au cœur des préoccupations. La vraie question est désormais ailleurs : qu'est-ce qu'une intégration stratégique de l'IA ? Que signifie réellement réussir avec l'IA quand on est une entreprise ou une institution publique ? Les organisations qui deviennent véritablement AI-native ne se contentent pas d'outils, elles font des choix structurants : sur leurs données, sur leurs modèles, sur leurs opérations et sur leurs partenaires. Ce fireside chat explore ces décisions, les risques à anticiper, et ce qui distingue une transformation superficielle d'un passage à une organisation AI-native."},{"id":"272936","type":"workshop","day":1,"title":"Keynote d'ouverture - Quelle roadmap de transformation pour être prêt pour les débuts du Quantum Computing à 36 mois","time_start":"10:00","time_end":"10:20","room":"VAC","theme":"Advanced Computing","sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.272936.x.html","curated":false,"owner":null,"top":false,"description":"Laurent-Pierre Baculard est Senior Partner au sein de Bain & Company à Paris. Avec 25 ans d'expérience dans les secteurs Telecom, Technologies et Défense Sécurité, il a accompagné de nombreux groupes francais et européens dans leurs transformations à l'arrivée de nouveaux CEOs et dans le contexte de ruptures de technologies. Il a dirigé le Secteur Telecom Media Tech en Europe-Moyen Orient, puis a été le premier Chief Digital Officer de Bain en Europe et a piloté la practice Innovation. Laurent-Pierre orchestre l'approche de Bain pour la préparation au Quantum Computing et engage tous les jours pour des clients aux forts enjeux de croissance et de plan de création de valeur. Il est Officier de Réserve dans la Marine, focalisé sur la transformation Données-IA (programme « SIGNAL »)"},{"id":"269432","type":"workshop","day":1,"title":"Souveraineté numérique : comprendre les enjeux et faire les bons choix","time_start":"10:00","time_end":"10:30","room":"W1","theme":"Gouvernance & Réglementation","sponsor":"IBM","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.269432.x.html","curated":true,"owner":"F","top":false,"description":"On entend parler de souveraineté numérique à longueur de journée depuis des mois. Ce workshop a pour vocation de vous expliquer ce qui a changé, pourquoi c'est important, ce qu'il faut prioriser, et comment IBM peut vous accompagner dans vos choix, notamment grâce à son offre Sovereign Core."},{"id":"273283","type":"workshop","day":1,"title":"Rex Pigment : Product Intelligence - Comment transformer les feedbacks clients en moteur de croissance","time_start":"10:00","time_end":"10:30","room":"W2","theme":"Data & IA au service du Business","sponsor":"Google Cloud","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.273283.x.html","curated":false,"owner":null,"top":false,"description":"Découvrez comment Pigment transforme des retours clients fragmentés en décisions produit stratégiques. Nicolas Boussenina et Léa Benyamin (Data & Automations Engineers) présenteront les coulisses du projet Product Intelligence. Apprenez comment leur pipeline IA automatise la collecte et l'analyse de données non structurées (Freshdesk, Gong) pour les relier directement à l'ARR. En évaluant la criticité des demandes, Pigment aligne instantanément ses équipes GTM et Produit sur l'impact business réel. Une session clé pour découvrir comment la Data et l'IA maximisent la valeur produit."},{"id":"269441","type":"workshop","day":1,"title":"Bâtir une IA Generative contrôlée par le metier pour le marché de la finance","time_start":"10:00","time_end":"10:30","room":"W3","theme":"Data & IA au service du Business","sponsor":"Progress Software SAS","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.269441.x.html","curated":true,"owner":"C","top":false,"description":"Une IA générative digne de confiance au service du business prête pour la production grâce à un graphe de connaissance accessible aux métiers"},{"id":"274485","type":"workshop","day":1,"title":"Pourquoi vos agents IA ne comprennent pas votre métier : le rôle de Fabric IQ","time_start":"10:00","time_end":"10:30","room":"W4","theme":"Architecture Data Moderne","sponsor":"Microsoft","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.274485.x.html","curated":false,"owner":null,"top":false,"description":"Les données sont disponibles, les LLM sont puissants, mais les agents IA peinent souvent à comprendre le contexte métier de l'entreprise. Nous verrons comment Fabric IQ apporte la couche de sens nécessaire à l'IA grâce aux ontologies, au graphe métier et aux Data Agents. Une session orientée architecture et mise en œuvre, destinée aux architectes, data engineers et responsables data souhaitant passer de la donnée gouvernée à une intelligence gouvernée"},{"id":"269352","type":"conference","day":1,"title":"AI Factory France: infrastructures et services souverains pour accélérer l'adoption et l'usage de l'IA en France","time_start":"10:15","time_end":"10:35","room":"C3","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.269352.x.html","curated":false,"owner":null,"top":false,"description":"Sélectionné par la Commission Européenne le projet AI Factory France, piloté par GENCI avec le support d'Inria fédère une vingtaine d'acteurs publics et d'innovation autour de la mise en place d'une offre intégrée (one-stop shop) d'infrastuctures numériques (supercalculateurs) publiques et privées, de formation, d'expertise, d'accès à des jeux de données, modèles et outils. AI Factory France est intégrée dans un ensemble de 19 AI Factories en Europe. Ouverte aux industriels, académiques et services publics elle vise à accélérer l'adoption et l'usage à grande échelle de l'IA dans 12 verticales métiers incluant notamment la robotique, les matériaux, la défense, la finance, la mobilité, les sciences de la Terre, l'aeronautique ou l'éducation."},{"id":"262653","type":"conference","day":1,"title":"Sécurité, souveraineté et dépendance aux hyperscalers : bâtir un écosystème européen via une approche collective et open-source","time_start":"10:20","time_end":"11:10","room":"C2","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262653.x.html","curated":false,"owner":null,"top":false,"description":"Dans un contexte de forte dépendance aux hyperscalers, aux fournisseurs de cloud et aux grandes plateformes d'IA, les enjeux de cybersécurité, de souveraineté numérique et de maîtrise des données deviennent stratégiques pour les organisations européennes. Face à ces défis, entreprises, institutions et acteurs technologiques cherchent à reprendre le contrôle de leurs infrastructures, de leurs modèles et de leurs capacités d'innovation. Pour faire face à ces nouveaux défis et pour répondre aux besoins des utilisateurs, l'open source, l'interopérabilité et la mutualisation des efforts apparaissent aujourd'hui comme des leviers majeurs pour bâtir un écosystème européen plus souverain, résilient et indépendant. Cette table ronde réunira experts, industriels et décideurs pour débattre des approches concrètes."},{"id":"272537","type":"workshop","day":1,"title":"Quantum Computing, Today: Solving Real Industrial Problems Before the Perfect Qubit Arrives","time_start":"10:20","time_end":"10:40","room":"VAC","theme":"Advanced Computing","sponsor":"Colibritd","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.272537.x.html","curated":false,"owner":null,"top":false,"description":"Multi-physics simulation is the computational backbone of aerospace, defense, energy, semiconductors, and finance — but the equations these industries rely on are outgrowing what classical infrastructure can handle. This talk explores how quantum computing, even in today's \"noisy\" pre-fault-tolerant era, can already deliver tangible value for these use cases. Dr. Laurent Guiraud, co-founder and CEO of ColibriTD, will share how his team built an end-to-end Quantum-as-a-Service platform."},{"id":"262651","type":"conference","day":1,"title":"Des résultats, pas des expérimentations : les enseignements tirés du déploiement de l'IA à grande échelle chez Schneider Electric","time_start":"10:25","time_end":"10:50","room":"C1","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262651.x.html","curated":false,"owner":null,"top":false,"description":null},{"id":"262728","type":"conference","day":1,"title":"Lakehouse & Data Products : bâtir un socle data prêt pour industrialiser l'IA","time_start":"10:35","time_end":"11:10","room":"C3","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262728.x.html","curated":false,"owner":null,"top":false,"description":"L'industrialisation de l'IA ne repose pas sur le seul choix des modèles, mais sur la capacité de l'entreprise à structurer un socle data fiable et gouverné. Nous présentons en quoi une architecture Lakehouse, organisée autour de Data Products et de la Context Layer, constitue aujourd'hui une base pertinente pour préparer l'exploitation de la donnée par des agents IA. En filigrane, un constat partagé dans l'industrie... Sans qualité, sans gouvernance et sans cadre sémantique partagé, il n'y a pas d'IA réellement industrialisable !"},{"id":"268735","type":"workshop","day":1,"title":"Vos agents Text-to-SQL : plus précis, moins chers. Le pouvoir d'un meilleur contexte","time_start":"10:35","time_end":"11:05","room":"W1","theme":"Architecture Data Moderne","sponsor":"Neo4j","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.268735.x.html","curated":true,"owner":"C","top":false,"description":"Injecter 50 tables de schéma dans un prompt, c'est offrir à votre LLM un annuaire quand il cherche un numéro. Résultat : des tokens gaspillés, du bruit, et des hallucinations sur les jointures complexes. Dans cet atelier, on retourne le problème. Plutôt que d'élargir le contexte, on améliore la carte : Neo4j stocke la structure de votre base, le glossaire métier, les contraintes et les jointures inférées depuis vos logs. L'agent récupère uniquement le sous-graphe pertinent via recherche sémantique — rien de plus. Sur une base HR réelle (PostgreSQL, ~50 tables) : −20 à −30 % de tokens en moyenne, jusqu'à 10× moins sur les requêtes simples, et +10 points de précision sur les requêtes multi-tables. Vous repartez avec une architecture GraphRAG concrète, testée, applicable à votre stack."},{"id":"268743","type":"workshop","day":1,"title":"Architect your data foundation for the Autonomous Enterprise","time_start":"10:35","time_end":"11:05","room":"W2","theme":"Architecture Data Moderne","sponsor":"DREMIO","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.268743.x.html","curated":false,"owner":null,"top":false,"description":"The future of agentic enterprise will be driven by AI with the deepest organizational knowledge. For AI to be successful, it needs a data foundation with the context from business processes, policies, and logic that makes your data meaningful. This session by SAP and Dremio will show how to architect a business data fabric, along with key data lakehouse capabilities required to accelerate AI-driven business transformations."},{"id":"268745","type":"workshop","day":1,"title":"[SUCCESS STORY] Bouygues Telecom x ILLUIN Technology : Des Agents IA déployés à grande échelle sur plus de 25M d'appels clients / an","time_start":"10:35","time_end":"11:05","room":"W3","theme":"Data & IA au service du Business","sponsor":"ILLUIN Technology","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.268745.x.html","curated":true,"owner":"F","top":false,"description":"À travers l'analyse rétrospective du projet de BOUYGUES TELECOM, illustrée de nombreuses démos des plateformes ILLUIN Dialogue et Analyze, revivez le déploiement à grande échelle d'innovations de pointe en IA agentique au coeur des assistants conversationnels omnicanaux de l'opérateur télécom. Joël Brandt, Responsable de Domaine SI, Outils Assistance Client de BOUYGUES TELECOM, vous fera entrer dans les coulisses de ce projet qui réinvente les parcours client, en revenant sur les aspects de conception innovante, de choix technologiques, et de bénéfices clients et métiers. Parallèlement, Xavier VACCARI, Directeur Général Adjoint d'ILLUIN Technology, reviendra sur les différenciants des produits d'IA ILLUIN Suite qui transforment l'expérience client."},{"id":"269455","type":"workshop","day":1,"title":"IBM et IA générative : quand la conviction devient réalité chez Pro à Pro avec IBM Bob","time_start":"10:35","time_end":"11:05","room":"W4","theme":"Data & IA au service du Business","sponsor":"IBM","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.269455.x.html","curated":false,"owner":null,"top":false,"description":"Le cas d'utilisation qui sera présenté porte sur la réécriture complète de la documentation d'un module d'application IBM i existant, y compris les rôles et les profils des utilisateurs qui ont besoin de cette documentation."},{"id":"275178","type":"workshop","day":1,"title":"Vos données vont fuiter. La vraie question : que pourront-ils en faire ?","time_start":"10:35","time_end":"11:05","room":"W5","theme":"Data & IA au service du Business","sponsor":"Steamulo","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.275178.x.html","curated":false,"owner":null,"top":false,"description":"Que se passe-t-il lorsqu'un document contenant des données confidentielles est partagé, transmis ou exploité par un outil d'IA ? STEAMULO présentera CavIA, une solution de caviardage intelligent capable d'identifier et de rendre inexploitables les informations sensibles avant tout partage ou traitement."},{"id":"273134","type":"workshop","day":1,"title":"From demo to production: running AI agents on your own infrastructure","time_start":"10:40","time_end":"11:00","room":"VAC","theme":"Advanced Computing","sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.273134.x.html","curated":false,"owner":null,"top":false,"description":"Most enterprise AI projects work in the demo and stall on the way to production. Alliance Services Plus built Golem, a platform that installs on the client's own infrastructure, with specialised agents, private RAG and automated GPU orchestration."},{"id":"262692","type":"conference","day":1,"title":"Préparer les organisations pour l'IA agentique : leadership, gouvernance, adoption responsable","time_start":"10:50","time_end":"11:35","room":"C1","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262692.x.html","curated":true,"owner":"B","top":true,"description":null},{"id":"273854","type":"workshop","day":1,"title":"L'IA et le quantique vont-ils rendre votre cybersécurité obsolète ?","time_start":"11:00","time_end":"11:20","room":"VAC","theme":"Advanced Computing","sponsor":"QuRISK","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.273854.x.html","curated":false,"owner":null,"top":false,"description":"L'IA et le quantique redéfinissent la cybersécurité. La menace quantique sur RSA et ECC est connue, mais l'IA accélère aussi la découverte de faiblesses cryptographiques. Cette session explique les risques réels, le scénario Harvest Now Decrypt Later, et pourquoi la crypto-agilité devient un enjeu stratégique."},{"id":"262731","type":"conference","day":1,"title":"De l'expérimentation à l'adoption : comment l'ESA déploie l'intelligence artificielle","time_start":"11:10","time_end":"11:35","room":"C2","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262731.x.html","curated":false,"owner":null,"top":false,"description":null},{"id":"262730","type":"conference","day":1,"title":"Sécurité des systèmes d'IA : protéger ses données, ses modèles et leurs usages","time_start":"11:10","time_end":"11:40","room":"C3","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262730.x.html","curated":false,"owner":null,"top":false,"description":null},{"id":"271334","type":"workshop","day":1,"title":"Legacy → Snowflake : la transformation data de GLS France","time_start":"11:10","time_end":"11:40","room":"W1","theme":"Data & IA au service du Business","sponsor":"Popsink","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.271334.x.html","curated":true,"owner":"C","top":false,"description":"Chez GLS France, le problème n'a jamais été le manque de données, mais le fait qu'il en existait plusieurs versions. Thomas Pierrot (Head of Data, GLS France) présente la transformation en cours. Benjamin Djidi (CEO, Popsink) présente la brique qui conditionnait tout le reste : sortir la donnée du legacy en continu, sans toucher à la production."},{"id":"271138","type":"workshop","day":1,"title":"FME : la plateforme d'intégration pour tous les types de données et toutes les IA","time_start":"11:10","time_end":"11:40","room":"W2","theme":"Data & IA au service du Business","sponsor":"Safe Software","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.271138.x.html","curated":false,"owner":null,"top":false,"description":"FME est une plateforme complète pour le traitement des données et l'automatisation des processus métier. Cet atelier propose une introduction accessible à la plateforme FME."},{"id":"274366","type":"workshop","day":1,"title":"Gouvernance de l'iA : la méthode pour ne pas perdre le contrôle","time_start":"11:10","time_end":"11:40","room":"W3","theme":"Data & IA au service du Business","sponsor":"ORANGE BUSINESS","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.274366.x.html","curated":true,"owner":"F","top":false,"description":"Gouverner l'IA générative et agentique est devenu une condition de confiance. Didier Gaultier, Head of AI chez Orange Business, présentera les enjeux de la gouvernance des IA, les leviers pour reprendre le contrôle, et la méthodologie exclusive de déploiement IA d'Orange Business."},{"id":"268749","type":"workshop","day":1,"title":"Hyperviseur pour la coordination Interministérielle des crises : de l'héritage de Paris 2024 à un usage pérenne","time_start":"11:10","time_end":"11:40","room":"W4","theme":"Gouvernance & Réglementation","sponsor":"Suadeo","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.268749.x.html","curated":false,"owner":null,"top":false,"description":"Comment un dispositif conçu pour les Jeux de Paris 2024 est devenu un outil pérenne de coordination interministérielle des crises et des événements ? Conçu en 18 mois pour sécuriser les Jeux de Paris 2024, l'hyperviseur souverain du Centre National de Commandement Stratégique, créé avec Suadeo, a prouvé que son héritage dépassait l'événementiel."},{"id":"276096","type":"workshop","day":1,"title":"Vos LLM en production : coûts, risques, impact. Ce que vous ne voyez pas encore…","time_start":"11:10","time_end":"11:40","room":"W5","theme":"Gouvernance & Réglementation","sponsor":"Nautylus","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.276096.x.html","curated":true,"owner":"F","top":true,"description":"Factures provider opaques, coûts non affectés, agents qui s'enchainent sans traçabilité financière : la plupart des organisations qui utilisent des LLM en production naviguent à vue. Cet atelier propose une approche concrète pour reprendre le contrôle des coûts, des budgets et de l'empreinte environnementale."},{"id":"275615","type":"workshop","day":1,"title":"De l'IA frugale à l'intelligence embarquée grâce aux approches inspirées du quantique","time_start":"11:20","time_end":"11:40","room":"VAC","theme":"Advanced Computing","sponsor":"Multiverse Computing SAS","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.275615.x.html","curated":false,"owner":null,"top":false,"description":"Compresser les modèles d'IA grâce aux approches inspirées du quantique pour réduire leur consommation de ressources. Des cas concrets illustrent le passage à une IA frugale et embarquée."},{"id":"262930","type":"conference","day":1,"title":"IA et transformation des métiers : enjeux humains, organisationnels et managériaux","time_start":"11:35","time_end":"12:00","room":"C2","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262930.x.html","curated":false,"owner":null,"top":false,"description":null},{"id":"262729","type":"conference","day":1,"title":"De l'initiative locale au déploiement mondial : comment Servier réinvente son organisation avec l'IA","time_start":"11:40","time_end":"12:05","room":"C1","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262729.x.html","curated":false,"owner":null,"top":false,"description":"Face à la complexité croissante des échanges avec les professionnels de santé, les méthodes de formation classiques atteignent leurs limites. Servier a fait le pari de l'IA générative en créant un environnement d'entraînement basé sur des avatars conversationnels. D'une simple initiative locale à un déploiement pour 6 000 collaborateurs à travers le monde."},{"id":"262735","type":"conference","day":1,"title":"Quand la donnée fraîche dicte la décision : construire une plateforme prête pour l'IA","time_start":"11:40","time_end":"12:15","room":"C3","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262735.x.html","curated":false,"owner":null,"top":false,"description":"Dans une transformation digitale qui s'accélère pour intégrer l'IA et les agents autonomes, la fraîcheur et la qualité de la donnée sont des enjeux majeurs. Airbus souhaite répondre aux nombreux cas d'usage métier où une décision prise sur une donnée qui n'est pas fraîche est une décision déjà obsolète. Cette session est un retour d'expérience sur la construction de la plateforme centrale de Data Products temps réel."},{"id":"275616","type":"workshop","day":1,"title":"Panel discussion with COLIBRITD, AS+, QURISK, MULTIVERSE COMPUTING, SYSTEMATIC","time_start":"11:40","time_end":"12:10","room":"VAC","theme":"Advanced Computing","sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.275616.x.html","curated":false,"owner":null,"top":false,"description":null},{"id":"269433","type":"workshop","day":1,"title":"Quelle est la courbe de maturité de l'Agentique dans les projets informatiques","time_start":"11:45","time_end":"12:05","room":"W1","theme":"Data & IA au service du Business","sponsor":"ARTIK CONSULTING","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.269433.x.html","curated":false,"owner":null,"top":false,"description":null},{"id":"269438","type":"workshop","day":1,"title":"Transformation Agentique : une équipe d'agents IA au service de votre business, sans perdre le contrôle","time_start":"11:45","time_end":"12:15","room":"W2","theme":"Data & IA au service du Business","sponsor":"ekino","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.269438.x.html","curated":true,"owner":"F","top":false,"description":"L'agentique, ce n'est pas donner accès à un LLM à chacun. La vraie rupture ? Une équipe d'agents qui travaillent pour vous. À travers le retour d'expérience Havas et des démonstrations live, découvrez comment passer à l'agentique sans s'enfermer, sans se ruiner et en garantissant la sécurité de vos données."},{"id":"268747","type":"workshop","day":1,"title":"Du catalogue de données au Data Product","time_start":"11:45","time_end":"12:15","room":"W3","theme":"Architecture Data Moderne","sponsor":"BLUEWAY","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.268747.x.html","curated":true,"owner":"C","top":false,"description":"Comment les données existantes peuvent-elles être transformées en un actif exploitable, accessible et fiable pour les métiers ? L'équipe SoftProject vous explique comment valoriser vos données avec une solution de catalogage."},{"id":"269456","type":"workshop","day":1,"title":"Cas d'usage stratégiques, petits gains du quotidien : les deux visages de l'IA dans nos métiers","time_start":"11:45","time_end":"12:15","room":"W4","theme":"Data & IA au service du Business","sponsor":"SQUARE MANAGEMENT","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.269456.x.html","curated":false,"owner":null,"top":false,"description":"Nous partagerons un retour d'expérience concret sur les deux visages de l'IA en entreprise : d'un côté, des cas d'usage stratégiques qui transforment les métiers ; de l'autre, des usages simples du quotidien, qui font naître une culture IA portée par les équipes."},{"id":"274519","type":"workshop","day":1,"title":"Comment SNCF a modernisé l'accès aux données Financières de son ERP ?","time_start":"11:45","time_end":"12:15","room":"W5","theme":"Architecture Data Moderne","sponsor":"ORACLE","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.274519.x.html","curated":false,"owner":null,"top":false,"description":"SNCF a révolutionné l'accès aux données de son ERP en passant d'une architecture historique complexe à une solution unifiée, offrant un accès en libre-service et en temps réel, avec Oracle Analytics Cloud et une AI Data Platform."},{"id":"271041","type":"workshop","day":1,"title":"Les retombées de l'IA : pourquoi les gains de productivité liés à l'IA ne se répercutent pas sur votre P&L","time_start":"12:20","time_end":"12:50","room":"W1","theme":"Data & IA au service du Business","sponsor":"IBM","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.271041.x.html","curated":false,"owner":null,"top":false,"description":"L'IA génère de réels gains de productivité, mais la plupart des entreprises ne constatent toujours aucun impact sur leur P&L. IBM Consulting expliquera pourquoi, et partagera des retours d'expérience concrets : passer d'une productivité centrée sur les outils à une refonte des modèles de delivery avec des AI-first pods."},{"id":"268746","type":"workshop","day":1,"title":"L'IA ne doit pas inventer votre entreprise","time_start":"12:20","time_end":"12:50","room":"W3","theme":"Data & IA au service du Business","sponsor":"JD Conseil","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.268746.x.html","curated":false,"owner":null,"top":false,"description":"Un projet IA peut être techniquement irréprochable et échouer quand même. Pas parce que le modèle est mauvais, mais parce que personne n'a écrit les règles du métier qu'il est censé respecter. Jonathan Grinal, président de JD Conseil, le démontre en direct sur scène avec Joseph, la plateforme développée pour transformer la connaissance métier en cadre vérifié."},{"id":"273284","type":"workshop","day":1,"title":"mAIstro Forge : Forger le socle de fabrication des agents IA pour industrialiser leur développement chez Carrefour","time_start":"12:20","time_end":"12:50","room":"W4","theme":"Data & IA au service du Business","sponsor":"Google Cloud","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.273284.x.html","curated":false,"owner":null,"top":false,"description":"Ces derniers mois, plusieurs équipes chez Carrefour ont développé leurs propres agents IA de manière autonome. Pour sortir de cette fragmentation, le groupe a lancé Maistro Forge, une initiative transverse pour harmoniser les pratiques et industrialiser la production d'agents IA en garantissant sécurité et suivi."},{"id":"274470","type":"workshop","day":1,"title":"Où sont vos données, qui y accède, comment les partager ? Vers une gouvernance souveraine et opérationnelle","time_start":"12:55","time_end":"13:05","room":"W1","theme":"Gouvernance & Réglementation","sponsor":"Lakestrike","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.274470.x.html","curated":false,"owner":null,"top":false,"description":"Les entreprises disposent de toujours plus de données, réparties entre différents environnements. Nous montrerons comment une approche de gouvernance opérationnelle permet de relier les enjeux métier et techniques autour de la découverte des données, du contrôle des accès, de la protection, de la qualité et du partage."},{"id":"275282","type":"workshop","day":1,"title":"Comment rester visible à l'ère de l'IA en B2B ?","time_start":"12:55","time_end":"13:05","room":"W2","theme":"Data & IA au service du Business","sponsor":"Gtec - Groupe Purpl","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.275282.x.html","curated":false,"owner":null,"top":false,"description":"Pendant des années, être visible en B2B signifiait être bien positionné dans Google. L'arrivée des moteurs de réponse et des LLMs change les règles du jeu. Ce workshop décryptera les nouveaux mécanismes de visibilité à l'ère de l'IA (SEO vs GEO) et leurs conséquences pour les stratégies marketing B2B."},{"id":"274478","type":"workshop","day":1,"title":"OFBYTES","time_start":"12:55","time_end":"13:05","room":"W3","theme":"Data & IA au service du Business","sponsor":"OfBytes","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.274478.x.html","curated":false,"owner":null,"top":false,"description":null},{"id":"274514","type":"workshop","day":1,"title":"Comment passer de l'expérimentation à la transformation ?","time_start":"12:55","time_end":"13:05","room":"W4","theme":"Data & IA au service du Business","sponsor":"SEV7N","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.274514.x.html","curated":false,"owner":null,"top":false,"description":"De nombreux projets d'IA restent au stade de l'expérimentation, non par manque de technologie, mais parce que l'organisation n'est pas toujours prête. Trois conditions essentielles pour passer à l'usage : cap clair, préparation de l'organisation, sécurisation de l'exécution."},{"id":"275630","type":"workshop","day":1,"title":"À qui appartient la décision ? Quand l'IA agit en votre nom","time_start":"12:55","time_end":"13:05","room":"W5","theme":"Data & IA au service du Business","sponsor":"NERA PULSE SARL","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.275630.x.html","curated":false,"owner":null,"top":false,"description":"Chercher un emploi, recruter, publier une mission, se faire payer : ces gestes butent rarement sur la technologie, ils butent sur le formulaire. NERA PULSE développe Quick Job et Quick Money, pilotées par QUICK AI, avec une architecture de consentement vérifiable : qui a décidé ?"},{"id":"275192","type":"workshop","day":1,"title":"Piloter sa transformation IA comme un P&L : du shadow AI au ROI démontré","time_start":"13:10","time_end":"13:20","room":"W1","theme":"Gouvernance & Réglementation","sponsor":"Fruggr","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.275192.x.html","curated":false,"owner":null,"top":false,"description":"Les entreprises ont massivement déployé l'IA, très peu savent la piloter. Cette intervention présente une méthode concrète pour piloter sa transformation IA comme un P&L, autour de quatre indicateurs : adoption réelle, shadow AI détecté, qualité des usages et valeur créée."},{"id":"272795","type":"workshop","day":1,"title":"Comment l'Open Data peut vous aider à mieux connaître vos clients… et à qualifier vos prospects","time_start":"13:10","time_end":"13:20","room":"W2","theme":"Data & IA au service du Business","sponsor":"OpenKey","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.272795.x.html","curated":false,"owner":null,"top":false,"description":"Dis-moi où tu habites, je te dirai qui tu es. Vos données clients ont plus de valeur que vous ne l'imaginez. En les enrichissant avec des centaines de sources Open Data, OpenKey révèle des informations inédites pour mieux segmenter, scorer et qualifier vos clients et prospects."},{"id":"274479","type":"workshop","day":1,"title":"Bonne nouvelle, l'AI Act s'est adouci. Mauvaise nouvelle, votre problème est intact","time_start":"13:10","time_end":"13:20","room":"W3","theme":"Gouvernance & Réglementation","sponsor":"BRAIN SECURITY","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.274479.x.html","curated":false,"owner":null,"top":false,"description":null},{"id":"274776","type":"workshop","day":1,"title":"De l'IA qui conseille à l'IA qui agit : automatiser le cycle commercial de bout en bout","time_start":"13:10","time_end":"13:20","room":"W4","theme":"Data & IA au service du Business","sponsor":"BILLIEBOT","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.274776.x.html","curated":false,"owner":null,"top":false,"description":"Les copilotes IA savent résumer, rédiger et recommander. À travers Billie, découvrez comment emails, CRM, agenda, devis, commandes et factures peuvent être réunis pour permettre à un agent IA de suivre une affaire de la demande entrante jusqu'au paiement, avec le niveau d'autonomie choisi par l'entreprise."},{"id":"273280","type":"workshop","day":1,"title":"De la R&D au ROI : industrialiser l'IA et embarquer les équipes en 2026","time_start":"13:10","time_end":"13:20","room":"W5","theme":"Data & IA au service du Business","sponsor":"StackEasy","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.273280.x.html","curated":false,"owner":null,"top":false,"description":"2024-2025 aura été l'ère du POC. 2026 marque une bascule : on ne finance plus de la R&D, on engage un investissement attendu sur des cas d'usage orientés ROI. StackEasy partage sa méthode combinant industrialisation technique et conduite du changement."},{"id":"273304","type":"workshop","day":1,"title":"Collecte, conformité, fraude : enfin des parcours 100% automatisés et sécurisés","time_start":"13:25","time_end":"13:35","room":"W1","theme":"Data & IA au service du Business","sponsor":"ITESOFT INNOVATION","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.273304.x.html","curated":false,"owner":null,"top":false,"description":"Un dossier complet, cohérent, propre… et pourtant frauduleux. Avec l'IA générative, produire de faux documents est devenu rapide, massif — et de plus en plus difficile à détecter. Démonstration en direct du traitement d'un dossier complet, de la collecte à la détection de fraude."},{"id":"274474","type":"workshop","day":1,"title":"UBBY AI","time_start":"13:25","time_end":"13:35","room":"W2","theme":"Data & IA au service du Business","sponsor":"Ubby AI","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.274474.x.html","curated":false,"owner":null,"top":false,"description":null},{"id":"268753","type":"workshop","day":1,"title":"Vos LLM en production : coûts, risques, impact. Ce que vous ne voyez pas encore…","time_start":"13:25","time_end":"13:35","room":"W4","theme":"Gouvernance & Réglementation","sponsor":"Nautylus","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.268753.x.html","curated":false,"owner":null,"top":false,"description":"Factures provider opaques, coûts non affectés, agents qui s'enchainent sans traçabilité financière, données sensibles qui transitent vers des modèles externes : la plupart des organisations qui utilisent des LLM en production naviguent à vue. Cet atelier propose une approche concrète pour reprendre le contrôle : mesurer les coûts réels par projet, équipe et workflow agentique."},{"id":"274523","type":"workshop","day":1,"title":"Vos agents IA sont observables. Mais sont-ils vraiment sous contrôle ?","time_start":"13:25","time_end":"13:35","room":"W5","theme":"Gouvernance & Réglementation","sponsor":"Treans.ia","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.274523.x.html","curated":false,"owner":null,"top":false,"description":"Les entreprises déploient de plus en plus d'agents IA capables d'interagir avec leurs outils, leurs données et leurs processus métiers. Ce workshop explore la couche qui manque encore aux architectures agentiques : le contrôle — versionner modèles, prompts, outils, permissions, politiques et mémoire."},{"id":"274475","type":"workshop","day":1,"title":"ETL, BI et AI : Comment valoriser vos données avec une Data Plateforme souveraine ?","time_start":"13:40","time_end":"14:10","room":"W2","theme":"Data & IA au service du Business","sponsor":"DIGDASH","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.274475.x.html","curated":false,"owner":null,"top":false,"description":"Multiplicité des outils décisionnels, coûts incontrôlés et vendor lock-in : le défi est de taille pour les DSI en quête d'une architecture moderne et souveraine à budget maîtrisé. Antoine Buat présentera les solutions pour valoriser efficacement vos données."},{"id":"274481","type":"workshop","day":1,"title":"Projet Ariane : les trois clés du MEDEF pour réussir son agent IA (tech, adoption, impact)","time_start":"13:40","time_end":"14:10","room":"W3","theme":"Data & IA au service du Business","sponsor":"CRAFT AI","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.274481.x.html","curated":false,"owner":null,"top":false,"description":"Comment passer de l'expérimentation de l'IA générative à un agent opérationnel utilisé au quotidien ? Avec le projet Ariane, le MEDEF a franchi le cap pour réinventer l'accompagnement de ses adhérents. Trois piliers : choix d'architecture et de sécurité, leviers d'acculturation, mesure réelle de la valeur créée."},{"id":"274618","type":"workshop","day":1,"title":"L'IA agentique en environnement régulé : orchestrer des processus critiques sans sacrifier la conformité","time_start":"13:40","time_end":"14:10","room":"W4","theme":"Data & IA au service du Business","sponsor":"smartpush","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.274618.x.html","curated":false,"owner":null,"top":false,"description":"Dans les secteurs régulés, l'IA agentique promet des gains d'efficacité considérables mais se heurte à un double impératif : rester conforme et préserver la qualité de l'expérience client. Cédric Nallet (CEO de smartpush) montrera comment orchestrer des processus critiques sans opposer sécurité réglementaire et fluidité."},{"id":"274409","type":"workshop","day":1,"title":"The Agentic Data Stack: Vitesse et simplicité au cœur d'une IA qui scale","time_start":"13:40","time_end":"14:10","room":"W5","theme":"Data & IA au service du Business","sponsor":"ClickHouse, Inc.","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.274409.x.html","curated":false,"owner":null,"top":false,"description":"Data teams are drowning under the pace of AI adoption. This session explores how the shift to agentic AI is breaking the old trade-offs between scale, speed, cost, and simplicity, and introduces ClickHouse's Agentic Data Stack, a unified data platform for AI-era workloads."},{"id":"262652","type":"conference","day":1,"title":"Passer à l'échelle avec l'IA : construire une IA souveraine au service du métier","time_start":"14:00","time_end":"14:25","room":"C1","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262652.x.html","curated":false,"owner":null,"top":false,"description":"Dans un contexte de grands investissements industriels, notamment autour des chantiers EPR2, l'IA fait partie des leviers mobilisés par EDF pour renforcer l'efficacité et la performance opérationnelle du Groupe. EDF déploie l'IA selon deux approches complémentaires : l'IA du quotidien pour tous les salariés et l'IA transformative intégrée aux processus métiers. L'intervention reviendra sur les conditions du passage à l'échelle : données de qualité, processus simplifiés, acculturation, gouvernance et maîtrise des coûts d'usage de l'IA. Franck MICHON précisera l'approche souveraine retenue pour les usages industriels critiques, avec un enjeu particulier de maîtrise et de sécurisation des données sensibles liées aux activités nucléaires. L'enjeu : déployer une IA performante, robuste, sécurisée, au service des métiers, de la performance opérationnelle et de la protection des données du Groupe. Dispose d'un menu contextuel"},{"id":"262695","type":"conference","day":1,"title":"Responsabilité juridique, conformité à l'AI Act et gouvernance des décisions automatisées","time_start":"14:00","time_end":"14:25","room":"C2","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262695.x.html","curated":true,"owner":"B","top":true,"description":null},{"id":"262732","type":"conference","day":1,"title":"Architectures cloud & IA : adopter, sécuriser et maîtriser l'Open source comme alternative souveraine","time_start":"14:00","time_end":"14:50","room":"C3","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262732.x.html","curated":true,"owner":"F","top":true,"description":"Cette table-ronde s'articulera autour de 3 grands thèmes : Definition de l'open source par rapport à l'enjeu des compétences, les défis de la souveraineté et de la résilience en open source, l'enjeu du passage à l'échelle. Alors que les organisations cherchent à renforcer leur souveraineté numérique et à maîtriser leurs architectures cloud et IA, l'open source apparaît comme une alternative crédible aux modèles propriétaires."},{"id":"269435","type":"workshop","day":1,"title":"Articulation entre des API, un Serveur MCP et un LLM dans le cadre du suivi automatisé des Colis de La Poste","time_start":"14:15","time_end":"14:45","room":"W1","theme":"Data & IA au service du Business","sponsor":"ARTIK CONSULTING","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.269435.x.html","curated":false,"owner":null,"top":false,"description":null},{"id":"268744","type":"workshop","day":1,"title":"FME et MCP : le pont entre vos données et vos IA","time_start":"14:15","time_end":"14:45","room":"W2","theme":"Data & IA au service du Business","sponsor":"Safe Software","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.268744.x.html","curated":false,"owner":null,"top":false,"description":"Le Model Context Protocol (MCP) permet aux intelligences artificielles de se connecter de manière standardisée à des données, des applications et des outils métier. Cet atelier propose une introduction concrète à l'utilisation de FME avec le protocole MCP, avec découverte de FME Flow comme serveur MCP pour exposer des traitements et des données aux assistants IA."},{"id":"274482","type":"workshop","day":1,"title":"Google Agentic Data Cloud : Les agents IA au cœur de la chaîne de valeur de vos données","time_start":"14:15","time_end":"14:45","room":"W3","theme":"Data & IA au service du Business","sponsor":"Google Cloud","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.274482.x.html","curated":false,"owner":null,"top":false,"description":"Découvrez comment les agents IA Google Cloud modernisent et accélèrent la chaîne de valeur de la donnée. Que vous soyez Métier, Data Engineer, Analyst, Scientist ou Data Steward, découvrez avec des cas pratiques comment l'IA agentique assiste chaque profil au quotidien."},{"id":"268752","type":"workshop","day":1,"title":"Assurance Maladie : comment évaluer et faire évoluer les pratiques chirurgicales au service de la qualité des soins ?","time_start":"14:15","time_end":"14:45","room":"W4","theme":"Data & IA au service du Business","sponsor":"Suadeo","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.268752.x.html","curated":false,"owner":null,"top":false,"description":"Comment rendre des millions de données chirurgicales accessibles et directement utiles aux professionnels de santé ? Conçu avec la plateforme Data et IA de Suadeo, VISUCHIR s'inscrit dans la stratégie de transparence et de partage des données de la Caisse Nationale de l'Assurance Maladie."},{"id":"274524","type":"workshop","day":1,"title":"Multi-agents, maîtrise totale : concevoir et gouverner vos systèmes d'IA avec Microsoft Foundry","time_start":"14:15","time_end":"14:45","room":"W5","theme":"Architecture Data Moderne","sponsor":"Microsoft","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.274524.x.html","curated":false,"owner":null,"top":false,"description":"Benjamin partagera les bonnes pratiques de mise en œuvre des agents IA avec Microsoft Foundry, les choix d'architecture à privilégier, ainsi que les enjeux de sécurité, de gouvernance et de passage à l'échelle rencontrés par les entreprises."},{"id":"274848","type":"conference","day":1,"title":"Pourquoi les applications d'IA multimodèles finiront par s'imposer","time_start":"14:25","time_end":"14:50","room":"C1","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.274848.x.html","curated":true,"owner":"F","top":true,"description":"De l'ère du modèle à l'ère de l'orchestration : les applications d'IA ne reposent plus nécessairement sur un modèle unique. Le multimodèle comme enjeu de résilience : dépendre d'un modèle ou d'un fournisseur unique crée un point de fragilité. Stanislas Polu (Dust) expliquera comment une architecture multimodèle permet de maintenir la continuité de service."},{"id":"262929","type":"conference","day":1,"title":"Macif : faire de la donnée de confiance le moteur d'une IA métier à grande échelle","time_start":"14:25","time_end":"14:50","room":"C2","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262929.x.html","curated":false,"owner":null,"top":false,"description":"La Data est le fondement de toute stratégie d'IA créatrice de valeur — Fahmi Jendoubi, CDO Macif. Pour la Macif, sa performance et sa responsabilité reposent sur des fondamentaux incontournables : une donnée de confiance, fiable et gouvernée. Découvrez comment le groupe transforme la Data, l'IA et l'intelligence collective en un avantage stratégique concret."},{"id":"274317","type":"workshop","day":1,"title":"Edge AI Revolution: Overcoming the Memory Bottleneck","time_start":"14:30","time_end":"14:50","room":"VAC","theme":"Advanced Computing","sponsor":"Nellow","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.274317.x.html","curated":false,"owner":null,"top":false,"description":"NELLOW aims to deliver a breakthrough in Edge AI performance by commercializing its SPARK edge AI chip and ORBIT SDK, addressing the Memory Wall and unsustainable power consumption with In-Memory Computing, providing a sovereign European hardware-software stack."},{"id":"262657","type":"conference","day":1,"title":"Pourquoi avoir un benchmark IA maison : construire un pipeline qui devient un actif durable","time_start":"14:50","time_end":"15:20","room":"C1","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262657.x.html","curated":true,"owner":"F","top":true,"description":"Chaque mois apporte son lot de nouveaux modèles d'IA générative - LLMs, solutions de transcription et de synthèse vocale, OCR - plus performants, moins chers ou plus rapides que les précédents. Mais les benchmarks publics, rapidement obsolètes et déconnectés des cas d'usage réels, ne permettent ni de choisir un modèle en confiance ni d'arbitrer objectivement un changement. Au-delà, une conviction s'impose: toute grande entreprise qui déploie l'IA générative à l'échelle a intérêt à construire son propre référentiel d'évaluation. Cette conférence présente le retour d'expérience de BPCE dans la construction d'un pipeline de benchmarking interne pour ses modèles d'IA générative."},{"id":"262694","type":"conference","day":1,"title":"Comment garantir la fiabilité et la sécurité des IA embarquées dans des systèmes critiques","time_start":"14:50","time_end":"15:15","room":"C2","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262694.x.html","curated":false,"owner":null,"top":false,"description":null},{"id":"262733","type":"conference","day":1,"title":"Industrialiser la transformation de la connaissance métier : architecture et gouvernance","time_start":"14:50","time_end":"15:25","room":"C3","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262733.x.html","curated":false,"owner":null,"top":false,"description":null},{"id":"268738","type":"workshop","day":1,"title":"Décrypter l'AI Act européen : usages de l'IA, niveaux de risque, obligations et mise en conformité avec Kong","time_start":"14:50","time_end":"15:20","room":"W1","theme":"Gouvernance & Réglementation","sponsor":"Kong","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.268738.x.html","curated":true,"owner":"F","top":false,"description":"La loi européenne sur l'IA transforme les recommandations volontaires en obligations légales. Pour les organisations déployant des LLM, il ne s'agit plus seulement d'innover, mais de respecter les exigences de transparence, de gouvernance des données et de traçabilité. Découvrez comment mettre en œuvre un plan de contrôle de l'IA centralisé pour répondre aux articles 10, 12 et 50 de l'AI Act."},{"id":"269440","type":"workshop","day":1,"title":"Plateforme IA nouvelle génération : comment construire et passer à l'échelle","time_start":"14:50","time_end":"15:20","room":"W2","theme":"Architecture Data Moderne","sponsor":"ARTEFACT","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.269440.x.html","curated":false,"owner":null,"top":false,"description":"Les modèles s'améliorent tous les trimestres, et pourtant la plupart des agents IA ne dépassent pas le stade du pilote. Le problème n'est plus l'intelligence, mais tout ce qui ne se loue pas : le contexte métier, la mémoire, les droits d'agir, l'évaluation et la supervision de ce que font réellement les agents."},{"id":"269459","type":"workshop","day":1,"title":"Data & IA : comment Eiffage transforme simplement ses processus métiers en applications ?","time_start":"14:50","time_end":"15:20","room":"W3","theme":"Data & IA au service du Business","sponsor":"ORACLE","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.269459.x.html","curated":false,"owner":null,"top":false,"description":null},{"id":"275193","type":"workshop","day":1,"title":"Transférer les données à la vitesse de l'innovation","time_start":"14:50","time_end":"15:20","room":"W4","theme":"Data & IA au service du Business","sponsor":"Riverbed","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.275193.x.html","curated":false,"owner":null,"top":false,"description":"Les projets d'IA et de cloud actuels reposent sur un facteur clé : acheminer rapidement des volumes massifs de données au bon endroit. Riverbed explorera comment transférer des pétaoctets de données de manière rapide, sécurisée et économique."},{"id":"273701","type":"workshop","day":1,"title":"La couche sémantique - le garant de vérité de vos agents IA","time_start":"14:50","time_end":"15:20","room":"W5","theme":"Data & IA au service du Business","sponsor":"Informatica from Salesforce","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.273701.x.html","curated":true,"owner":"B","top":false,"description":"Les projets d'IA agentique n'échouent pas sur les modèles, ils échouent sur le contexte. Quand vos agents ne partagent pas la même définition d'un client, d'un produit ou d'un risque, les décisions automatisées deviennent une source de coûts cachés. La couche sémantique est le système de contexte qui donne à vos agents un langage commun."},{"id":"262699","type":"conference","day":1,"title":"Traçabilité et audit des données dans les grands modèles de langage","time_start":"15:15","time_end":"15:40","room":"C2","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262699.x.html","curated":false,"owner":null,"top":false,"description":"Cette présentation aborde les méthodes permettant d'identifier l'origine des données utilisées pour entraîner ou affiner les grands modèles de langage (LLMs), ainsi que les enjeux de transparence, de confidentialité et de propriété intellectuelle sur les données textuelles."},{"id":"262664","type":"conference","day":1,"title":"IA : l'agentique au service des clients et des collaborateurs - Retour d'expérience","time_start":"15:20","time_end":"15:45","room":"C1","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262664.x.html","curated":false,"owner":null,"top":false,"description":"L'IA chez Bouygues Telecom : comment embarquer 10 000 collaborateurs ? De l'expérimentation à une adoption massive : bénéfices, risques, accompagnements. Quelles sont les conditions pour réussir le passage à l'échelle ? Un retour d'expérience sur l'IA au service des clients comme des collaborateurs, avec une conviction : l'IA n'est pas qu'un sujet technologique. C'est aussi un sujet humain, managérial et culturel."},{"id":"268256","type":"conference","day":1,"title":"Explorer un océan de données : comment le Shom valorise ses données avec FME","time_start":"15:25","time_end":"16:05","room":"C3","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.268256.x.html","curated":false,"owner":null,"top":false,"description":"Opérateur public de référence pour la connaissance de l'environnement physique marin, le SHOM s'appuie sur FME pour maîtriser toute la chaîne de valeur de ses données, de l'acquisition à la diffusion de produits et services. À travers l'exemple du projet Tethys, en production depuis plus de cinq ans, cette session montrera comment FME s'est imposé bien au-delà des seuls flux géospatiaux."},{"id":"269436","type":"workshop","day":1,"title":"Agilité agentique : combien de temps pour faire un PoC ?","time_start":"15:25","time_end":"15:55","room":"W1","theme":"Data & IA au service du Business","sponsor":"SQUARE MANAGEMENT","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.269436.x.html","curated":false,"owner":null,"top":false,"description":"Face aux échecs des PoC IA, ce workshop propose d'accélérer drastiquement les premières phases de vos projets IA. À l'ère des agents experts (code, design, sécurité), la vitesse de conception d'un prototype défie toutes les approches classiques : le frein n'est plus technique, c'est le métier, le facteur humain et l'adoption."},{"id":"274368","type":"workshop","day":1,"title":"ENFIN des iA agentiques efficaces pour vos collaborateurs","time_start":"15:25","time_end":"15:55","room":"W2","theme":"Data & IA au service du Business","sponsor":"ORANGE BUSINESS","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.274368.x.html","curated":false,"owner":null,"top":false,"description":"L'IA générative a conquis les entreprises, mais peine à tenir ses promesses. La vraie rupture, c'est l'IA agentique : elle démultiplie la valeur en automatisant les tâches critiques. Découvrez comment Orange Business déploie ces agents dans son support, ses opérations et ses RH avec Live Intelligence Studio."},{"id":"274484","type":"workshop","day":1,"title":"OKDP - une plateforme data souveraine, cloud-native et 100% open source","time_start":"15:25","time_end":"15:55","room":"W3","theme":"Architecture Data Moderne","sponsor":"TOSIT","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.274484.x.html","curated":false,"owner":null,"top":false,"description":"Face à la montée des coûts du Cloud et aux risques de dépendance aux éditeurs, OKDP (Open Kubernetes Data Platform) est une plateforme data entièrement open source, nativement conçue pour Kubernetes, couvrant l'intégralité du cycle de vie de la donnée avec Trino, Spark, Iceberg, Polaris, Airflow."},{"id":"270289","type":"workshop","day":1,"title":"Pourquoi les investissements en IA ne génèrent pas le ROI attendu","time_start":"15:25","time_end":"15:55","room":"W4","theme":"Data & IA au service du Business","sponsor":"Prosci","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.270289.x.html","curated":false,"owner":null,"top":false,"description":"Partout en Europe, les organisations investissent massivement dans l'intelligence artificielle — mais beaucoup ne parviennent pas à obtenir les retours attendus. Une étude Prosci met en évidence : les facteurs humains représentent 56 à 64% des défis d'implémentation, trois fois plus que les problématiques techniques."},{"id":"272207","type":"workshop","day":1,"title":"Pourquoi chaque cas d'usage IA redevient un projet data. Et comment en sortir","time_start":"15:25","time_end":"15:55","room":"W5","theme":"Architecture Data Moderne","sponsor":"Astora","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.272207.x.html","curated":true,"owner":"C","top":false,"description":"Un agent ou un cas d'usage IA ne vaut que la donnée qu'on lui confie — pas seulement celle propre des tables du lakehouse, aussi la donnée métier éparpillée dans les mails, contrats, comptes rendus. Ce workshop montre comment un socle unique et configurable permet de contextualiser et gouverner en continu la donnée non structurée."},{"id":"262700","type":"conference","day":1,"title":"Mise en place d'une gouvernance distribuée pour le Data Mesh","time_start":"15:40","time_end":"16:05","room":"C2","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262700.x.html","curated":false,"owner":null,"top":false,"description":"L'IA générative et le Talk to Data changent la manière d'accéder à la donnée, mais révèlent aussi un nouveau défi : rendre la donnée compréhensible, fiable et prête à l'usage. Découvrez comment une démarche Data Product / Data Mesh permet de concilier autonomie des métiers, gouvernance et création de valeur."},{"id":"262669","type":"conference","day":1,"title":"Comment l'IA fait évoluer les pratiques de recherche en ligne et d'achat chez Accor","time_start":"15:45","time_end":"16:10","room":"C1","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262669.x.html","curated":false,"owner":null,"top":false,"description":"Du search au conversationnel, l'IA redéfinit en profondeur la recherche voyage, la visibilité des marques et l'expérience client. À travers le cas Accor, cette session montrera pourquoi un groupe hôtelier doit devenir AI-readable, repenser sa distribution, sa technologie et ses KPI, et trouver le bon équilibre entre automatisation, personnalisation et intervention humaine."},{"id":"269437","type":"workshop","day":1,"title":"L'IA ne remplace pas les métiers. Elle redessine la valeur","time_start":"16:00","time_end":"17:00","room":"W1","theme":"Data & IA au service du Business","sponsor":"AIVANCITY","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.269437.x.html","curated":false,"owner":null,"top":false,"description":"Un jour, un développeur écrit 200 lignes de code en une matinée. Le lendemain, une IA le fait en 20 secondes. Cette conférence part d'un malentendu massif : non, l'intelligence artificielle ne supprime pas les métiers, elle déplace la valeur à l'intérieur même de ces métiers."},{"id":"270407","type":"workshop","day":1,"title":"La réalité de l'IA en PME : usages et limites","time_start":"16:00","time_end":"16:30","room":"W2","theme":"Data & IA au service du Business","sponsor":"YAKADATA","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.270407.x.html","curated":false,"owner":null,"top":false,"description":"On parle beaucoup des outils IA, mais en allant sur le terrain on se rend compte que l'intégration de ces technologies est plus complexe qu'il n'y paraît. À travers des exemples concrets nous verrons comment des PME arrivent à tirer de la valeur de l'IA et à embarquer leurs équipes."},{"id":"270931","type":"workshop","day":1,"title":"De l'expression de besoin métier au déploiement en 30 minutes : l'IA de confiance","time_start":"16:00","time_end":"16:30","room":"W3","theme":"Data & IA au service du Business","sponsor":"FORTERESSE AI","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.270931.x.html","curated":false,"owner":null,"top":false,"description":"Vos données sont dispersées dans des ERP, des CRM, des exports et des outils qui ne communiquent pas entre eux. Dans ce workshop, nous partons de données métier brutes et dispersées, et nous construisons une automatisation IA complète, jusqu'à la mise en production réelle."},{"id":"272880","type":"workshop","day":1,"title":"L'entreprise intelligente : quand l'IA révèle le savoir collectif","time_start":"16:00","time_end":"16:30","room":"W4","theme":"Data & IA au service du Business","sponsor":"Alfeo","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.272880.x.html","curated":false,"owner":null,"top":false,"description":"Tout le monde parle d'IA. Mais si votre connaissance est dispersée, obsolète ou introuvable, votre IA le sera aussi. L'intelligence artificielle ne crée pas la connaissance, elle en révèle la qualité. Les équipes d'Alfeo montrent comment la gestion des connaissances associée à une IA documentaire transforme un patrimoine documentaire en levier de performance."},{"id":"274525","type":"workshop","day":1,"title":"Faire le choix d'une data souveraine : le retour d'expérience de l'Urssaf","time_start":"16:00","time_end":"16:30","room":"W5","theme":"Architecture Data Moderne","sponsor":"DIGDASH","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.274525.x.html","curated":false,"owner":null,"top":false,"description":"Dans un contexte où les législations extraterritoriales comme le CLOUD Act ou la loi FISA font peser des risques réels sur les données hébergées par des sociétés non européennes, comment placer la souveraineté au premier rang des exigences ?"},{"id":"262701","type":"conference","day":1,"title":"Structurer la gouvernance et l'observabilité des données pour garantir la confiance dans l'IA","time_start":"16:05","time_end":"16:25","room":"C2","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262701.x.html","curated":false,"owner":null,"top":false,"description":null},{"id":"262737","type":"conference","day":1,"title":"Sécurité, souveraineté et autonomie : construire une architecture robuste","time_start":"16:05","time_end":"16:25","room":"C3","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262737.x.html","curated":false,"owner":null,"top":false,"description":null},{"id":"262656","type":"conference","day":1,"title":"Arbitrer et identifier les cas d'usages data et IA stratégiques et rentables","time_start":"16:10","time_end":"16:35","room":"C1","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262656.x.html","curated":false,"owner":null,"top":false,"description":null},{"id":"262726","type":"conference","day":1,"title":"Gouverner la donnée non structurée pour l'IA : faire du Savoir d'entreprise un actif","time_start":"16:25","time_end":"16:45","room":"C2","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262726.x.html","curated":false,"owner":null,"top":false,"description":"Hakim Mahiddine, CDAO d'Orano, partagera sa vision de l'évolution du Knowledge Management à l'ère de l'IA agentique. La keynote mettra en perspective le rôle de la gouvernance dans la circulation et l'enrichissement du Savoir de l'entreprise, ainsi que la place centrale de l'humain dans la régulation des agents."},{"id":"262736","type":"conference","day":1,"title":"Composants et systèmes pour les infrastructures du numérique : quelles priorités ?","time_start":"16:25","time_end":"17:00","room":"C3","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262736.x.html","curated":false,"owner":null,"top":false,"description":"Créée en 2024 et confiée au CEA, l'agence de programme ASIC structure la recherche nationale sur les technologies matérielles du numérique. À travers ses deux premiers programmes phares, CAMELIA et PHOENIX, cette session éclairera les verrous critiques de la souveraineté, des composants pour l'IA aux technologies de conception."},{"id":"271530","type":"conference","day":1,"title":"De la plateforme de données à l'entreprise agentique : déployer des agents IA à grande échelle sans perdre le contrôle","time_start":"16:35","time_end":"16:55","room":"C1","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.271530.x.html","curated":true,"owner":"F","top":true,"description":null},{"id":"274477","type":"workshop","day":1,"title":"Ontologie : modéliser le jumeau numérique de votre organisation","time_start":"16:35","time_end":"17:00","room":"W2","theme":"Architecture Data Moderne","sponsor":"Growthsystemes","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.274477.x.html","curated":false,"owner":null,"top":false,"description":"Codifier vos processus métiers, connecter l'ensemble de votre parc applicatif, indexer en continu votre GED, puis exploiter l'IA agentique via API, MCP, CLI — tout en restant souverain."},{"id":"273856","type":"workshop","day":1,"title":"Comment Intégrer l'IA Agentique en Banque : 5 Risques à Maîtriser","time_start":"16:35","time_end":"17:05","room":"W3","theme":"Data & IA au service du Business","sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.273856.x.html","curated":false,"owner":null,"top":false,"description":"L'IA agentique ouvre de nouvelles perspectives pour le secteur bancaire. Entre les premières expérimentations et un déploiement à l'échelle créateur de valeur, les défis restent nombreux. Ce workshop présentera 5 risques clés à maîtriser pour réussir l'intégration de l'IA agentique en banque."},{"id":"274313","type":"workshop","day":1,"title":"Quand l'IA écrit le code, qui le teste ?","time_start":"16:35","time_end":"16:45","room":"W4","theme":"Data & IA au service du Business","sponsor":"Thunders","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.274313.x.html","curated":false,"owner":null,"top":false,"description":"Chez nos clients, la majorité des développeurs utilisent un agent d'IA au quotidien. Le gain de productivité est net, mais les frictions remontées sont presque toutes des frictions de qualité. Le goulot d'étranglement a changé de place : ce n'est plus le code, c'est le test — 80% du temps des équipes est consacré à maintenir les tests."},{"id":"274526","type":"workshop","day":1,"title":"Vous ne passerez pas de 3 à 300 agents en faisant tout passer par l'IT","time_start":"16:35","time_end":"17:05","room":"W5","theme":"Data & IA au service du Business","sponsor":"corai by Baker Park","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.274526.x.html","curated":true,"owner":"F","top":false,"description":"Une centaine de cas d'usage IA cadrés en 2025. À deux ou trois projets IA, le modèle centralisé tient ; à trois cents, c'est une autre histoire — non par manque de compétence mais par manque de bande passante. Une troisième voie entre le tout-IT et le débrouillez-vous : infrastructure centrale, mais cartographie et pilotage aux métiers."},{"id":"275988","type":"workshop","day":1,"title":"AI Value Cloud FinOps : Maîtriser le coût réel de l'IA en production","time_start":"16:50","time_end":"17:05","room":"W2","theme":"Architecture Data Moderne","sponsor":"AI Value Cloud FinOps","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.275988.x.html","curated":false,"owner":null,"top":false,"description":"Maîtriser les concepts, les usages et les induct

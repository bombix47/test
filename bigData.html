eurs de coûts de l'IA. Utiliser un framework pragmatique comme levier d'optimisations, avec des cas concrets de Token Economy (maturité, métriques ROI, écarts stratégiques)."},{"id":"262660","type":"conference","day":2,"title":"Agents autonomes et computer use : quels impacts business concrets et opérationnels ?","time_start":"10:00","time_end":"10:20","room":"C1","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262660.x.html","curated":true,"owner":"F","top":true,"description":null},{"id":"271511","type":"conference","day":2,"title":"Women Leaders Shaping the Future of Trusted AI","time_start":"10:00","time_end":"10:50","room":"C2","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.271511.x.html","curated":false,"owner":null,"top":false,"description":"En partenariat avec Women in Big Data (WiBD)"},{"id":"276271","type":"workshop","day":2,"title":"More Than Moore: Europe's Bet for the Global AI Stack","time_start":"10:00","time_end":"10:20","room":"VAC","theme":"Advanced Computing","sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.276271.x.html","curated":false,"owner":null,"top":false,"description":null},{"id":"273282","type":"workshop","day":2,"title":"BPCE Assurances : Réussir sa transformation métier grâce à un socle Data","time_start":"10:00","time_end":"10:30","room":"W3","theme":"Data & IA au service du Business","sponsor":"Google Cloud","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.273282.x.html","curated":true,"owner":"C","top":false,"description":"Pour libérer la valeur de ses données et accélérer sur l'IA, BPCE Assurances IARD migre vers GCP afin de bâtir une plateforme unique de partage de données, décloisonner l'accès entre toutes ses lignes de métier et propulser l'innovation analytique et l'IA."},{"id":"273279","type":"workshop","day":2,"title":"De l'iA MANiA à l'entreprise agentique","time_start":"10:00","time_end":"10:30","room":"W5","theme":"Data & IA au service du Business","sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.273279.x.html","curated":false,"owner":null,"top":false,"description":"L'IA agentique promet des gains vertigineux — c'est l'iA MANiA ! Mais la valeur ne se décrète pas, elle se construit avec la bonne gouvernance et une stratégie efficace. Mick Levy, Directeur Stratégie et Innovation chez Orange Business, partage les clés concrètes tirées de son livre iA MANiA."},{"id":"262743","type":"conference","day":2,"title":"Future of computing : quantum centric supercomputing","time_start":"10:10","time_end":"10:40","room":"C3","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262743.x.html","curated":false,"owner":null,"top":false,"description":null},{"id":"262661","type":"conference","day":2,"title":"Des premières mises en production d'IA Générative aux multiples défis de l'agentique à l'échelle industrielle","time_start":"10:20","time_end":"10:45","room":"C1","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262661.x.html","curated":true,"owner":"F","top":true,"description":"Dès avril 2023, le Groupe Crédit Agricole a mise en œuvre une stratégie d'adoption maîtrisée de l'IA Générative afin de déployer cette technologie dans une approche responsable préservant la confiance des collaborateurs et des clients. Avec son plan stratégique ACT2028, l'ambition d'accélération de la transformation des métiers grâce à la Data et à l'IA est clairement formulée. Elle passe par la réalisation de projets réellement transformants telle que la banque conversationnelle agentique, s'appuyant sur des actifs technologiques mutualisés au sein d'une nouvelle entreprise IA (CA Artificial Intelligence)."},{"id":"274316","type":"workshop","day":2,"title":"Programmable 400G SmartNICs for AI and Security","time_start":"10:20","time_end":"10:40","room":"VAC","theme":"Advanced Computing","sponsor":"DynaNIC Semiconductors","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.274316.x.html","curated":false,"owner":null,"top":false,"description":"Companies keep buying GPUs, far less attention goes to the network around them. DYNANIC transforms standard FPGA cards into production-ready 400G SmartNICs combining hardware-level performance with software-like adaptability."},{"id":"268756","type":"workshop","day":2,"title":"Data Sovereignty in the Agentic Era","time_start":"10:35","time_end":"11:05","room":"W1","theme":"Gouvernance & Réglementation","sponsor":"DREMIO","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.268756.x.html","curated":true,"owner":"F","top":false,"description":"AI agents have introduced governance requirements that most data platforms were not originally designed to meet. This session explores how Apache Iceberg, Apache Polaris, and Apache Ossie (incubating) give organizations a vendor-neutral foundation for enforcing data sovereignty without lock-in."},{"id":"268758","type":"workshop","day":2,"title":"Chemin critique en temps réel : des heures de calcul ramenées à quelques secondes","time_start":"10:35","time_end":"11:05","room":"W2","theme":"Architecture Data Moderne","sponsor":"Neo4j","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.268758.x.html","curated":true,"owner":"C","top":false,"description":"Dans un pipeline batch, une chaîne de clearing financier ou un workflow de calcul risque, une seule question compte quand ça déraille : quel est le chemin le plus long encore en cours, right now ? Neo4j et GDS résolvent ça en quelques millisecondes sur des graphes dynamiques à grande échelle."},{"id":"268760","type":"workshop","day":2,"title":"[SUCCESS STORY] ILLUIN Technology x Capgemini : Relation client à l'ère de l'IA","time_start":"10:35","time_end":"11:05","room":"W3","theme":"Data & IA au service du Business","sponsor":"ILLUIN Technology","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.268760.x.html","curated":false,"owner":null,"top":false,"description":"À l'ère de l'IA agentique, la Relation Client s'impose comme l'un des terrains les plus propices au déploiement de l'IA. Mais transformer cette richesse informationnelle en expériences réellement fluides nécessite bien plus qu'un modèle d'IA. Comment exploiter et fiabiliser ces données ? Comment connecter les agents IA au système d'information ?"},{"id":"269470","type":"workshop","day":2,"title":"Retex : Un support informatique de nouvelle génération grâce à l'IA agentique","time_start":"10:35","time_end":"11:05","room":"W4","theme":"Data & IA au service du Business","sponsor":"IBM","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.269470.x.html","curated":false,"owner":null,"top":false,"description":"Et si votre support informatique pouvait réfléchir, prendre des décisions et agir ? Découvrez comment Novahe utilise l'IA agentique pour réinventer les opérations de support informatique."},{"id":"269472","type":"workshop","day":2,"title":"Gouvernance des données et des règles métiers pour le marché de la mancheterie","time_start":"10:35","time_end":"11:05","room":"W5","theme":"Data & IA au service du Business","sponsor":"Progress Software SAS","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.269472.x.html","curated":false,"owner":null,"top":false,"description":"Gouverner les données est nécessaire mais est-ce suffisant ? Cas d'usage dans le monde de la manufacture pour construire des BOMs, le routing associé dans un contexte multi-usines."},{"id":"262742","type":"conference","day":2,"title":"Découpler l'outil de la donnée : le pari de l'interopérabilité chez ADEO/Leroy Merlin","time_start":"10:40","time_end":"11:15","room":"C3","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262742.x.html","curated":true,"owner":"F","top":true,"description":"Migrer 120 000 dashboards SAP BusinessObjects vers Looker (GCP) en automatique, sans migrer les sources historiques sous-jacentes. ADEO / Leroy Merlin revient sur son choix technique fondé sur une couche SQL ouverte, pour une véritable interopérabilité contrôlée entre toutes les sources et cibles existantes."},{"id":"275618","type":"workshop","day":2,"title":"COSMIC SOUL","time_start":"10:40","time_end":"11:00","room":"VAC","theme":"Advanced Computing","sponsor":"Cosmic Soul Private Limited","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.275618.x.html","curated":false,"owner":null,"top":false,"description":null},{"id":"272499","type":"conference","day":2,"title":"Restitution de l'enquête IMA x Magic Lemp x BDAIP sur la maturité IA des entreprises françaises","time_start":"10:45","time_end":"11:05","room":"C1","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.272499.x.html","curated":false,"owner":null,"top":false,"description":"L'intelligence artificielle entre dans une nouvelle phase : celle du passage à l'échelle, de la transformation des métiers et de la refonte des organisations. Les entreprises françaises sont-elles réellement prêtes, technologiquement, humainement et structurellement, à intégrer durablement l'IA et l'agentique ?"},{"id":"262708","type":"conference","day":2,"title":"Construire une culture data forte : gouvernance, formation et adoption","time_start":"10:50","time_end":"11:15","room":"C2","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262708.x.html","curated":false,"owner":null,"top":false,"description":"En 2020, MGEN dispose de données bien gérées par sa DSI, mais les métiers n'en sont ni propriétaires ni responsables. Six ans plus tard, l'entreprise s'est dotée d'une direction Data & IA, d'une gouvernance fédérale de la donnée et d'un outil d'IA générative sécurisé. Ce retour d'expérience porte sur les conditions de cette autonomie."},{"id":"274314","type":"workshop","day":2,"title":"Wavelengths, Not Lasers: Rethinking the Scaling Knob in Datacenter","time_start":"11:00","time_end":"11:20","room":"VAC","theme":"Advanced Computing","sponsor":"Solinide Photonics AB","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.274314.x.html","curated":false,"owner":null,"top":false,"description":"The next decade of AI infrastructure will be defined by how efficiently light can carry information between chips. Multi-wavelength microcomb sources break the laser-array bottleneck for datacenter optical scaling."},{"id":"273296","type":"conference","day":2,"title":"Piloter la transformation Data de Generali France","time_start":"11:05","time_end":"11:35","room":"C1","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.273296.x.html","curated":false,"owner":null,"top":false,"description":"Dans un contexte réglementaire et de déploiement de l'IA, Generali a engagé une industrialisation de son Data Management, appuyé par la solution IDMC d'Informatica : gouvernance des données et Data Products, traçabilité automatisée du lignage, qualité des données maîtrisée."},{"id":"269462","type":"workshop","day":2,"title":"L'IA au cœur de la formulation cosmétique : comment l'ORÉAL R&I s'appuie sur l'IA","time_start":"11:10","time_end":"11:40","room":"W1","theme":"Data & IA au service du Business","sponsor":"SQUARE MANAGEMENT","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.269462.x.html","curated":false,"owner":null,"top":false,"description":null},{"id":"268759","type":"workshop","day":2,"title":"FME : la plateforme d'intégration pour tous les types de données et toutes les IA","time_start":"11:10","time_end":"11:40","room":"W2","theme":"Data & IA au service du Business","sponsor":"Safe Software","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.268759.x.html","curated":false,"owner":null,"top":false,"description":"FME est une plateforme complète pour le traitement des données et l'automatisation des processus métier. Cet atelier propose une introduction accessible à la plateforme FME, avec découverte de FME Form (no-code) et FME Flow (automatisation)."},{"id":"274619","type":"workshop","day":2,"title":"L'agentique à l'épreuve du réel","time_start":"11:10","time_end":"11:40","room":"W3","theme":"Data & IA au service du Business","sponsor":"Prisme.ai","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.274619.x.html","curated":false,"owner":null,"top":false,"description":"Tracer, maîtriser les coûts et auditer chaque action en temps réel."},{"id":"268761","type":"workshop","day":2,"title":"SUADEO","time_start":"11:10","time_end":"11:40","room":"W4","theme":"Data & IA au service du Business","sponsor":"Suadeo","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.268761.x.html","curated":false,"owner":null,"top":false,"description":null},{"id":"274472","type":"workshop","day":2,"title":"Du prompt à la production : construire les applications de l'ère agentique","time_start":"11:10","time_end":"11:40","room":"W5","theme":"Data & IA au service du Business","sponsor":"Microsoft","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.274472.x.html","curated":false,"owner":null,"top":false,"description":"L'IA permet aujourd'hui de créer des applications en quelques minutes. Avec Rayfin et Microsoft Fabric, il devient possible de les connecter directement aux données du Data Lake et aux modèles sémantiques de l'entreprise pour créer des applications intelligentes, sécurisées et gouvernées."},{"id":"262720","type":"conference","day":2,"title":"Gouvernance et sécurité de l'IA agentique : encadrer les usages, protéger ses données, garder le contrôle","time_start":"11:15","time_end":"12:05","room":"C2","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262720.x.html","curated":true,"owner":"F","top":true,"description":"L'essor des agents IA est amené à transformer en profondeur les usages et les habitudes de travail en entreprises. Derrière ces promesses émergent également de nouveaux enjeux en matière de gouvernance, de sécurité des données et de maîtrise des risques. Ce panel permettra de répondre aux questions posées par l'usage de ces IA, et partagera les actions et les bonnes pratiques et les stratégies concrètes à mettre en œuvre ainsi que les premiers retours d'expérience pour déployer les agents IA de manière sécurisée."},{"id":"272804","type":"conference","day":2,"title":"L'Oréal Agentic Platform : comment passer à l'ère agentique à l'échelle de l'entreprise","time_start":"11:15","time_end":"11:50","room":"C3","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.272804.x.html","curated":true,"owner":"F","top":true,"description":"En trois ans, L'Oréal est passé d'un assistant conversationnel interne sécurisé à une plateforme agentique déployée à l'échelle de l'entreprise, construite sur Google Cloud avec un Agentic Toolkit et un Gateway unifié. La session présentera l'interopérabilité entre agents via le protocole A2A, sécurité et gouvernance intégrées dès la conception."},{"id":"274315","type":"workshop","day":2,"title":"The Trust Infrastructure for Autonomous Mission-Critical AI","time_start":"11:20","time_end":"11:40","room":"VAC","theme":"Advanced Computing","sponsor":"Rhizome Labs","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.274315.x.html","curated":false,"owner":null,"top":false,"description":"In critical systems, 99% accuracy is not enough. Rhizome Labs is building the Autonomy Assurance Layer: an adaptive AI engine that detects distribution shift, monitors uncertainty and model health, and determines when a model should act, abstain, request human review, adapt, or roll back."},{"id":"262662","type":"conference","day":2,"title":"Futur du travail à l'ère de l'IA : transformations organisationnelles, compétences et management","time_start":"11:35","time_end":"12:20","room":"C1","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262662.x.html","curated":false,"owner":null,"top":false,"description":"L'intelligence artificielle transforme en profondeur les organisations, les métiers et les modes de travail. Pour préparer les organisations à cette nouvelle réalité, quelles stratégies mettre en œuvre pour développer les compétences de demain, accompagner l'évolution des métiers et favoriser une adoption durable de l'IA ? Cette table ronde réunira des dirigeants d'entreprise, des experts de l'IA et des acteurs des ressources humaines."},{"id":"275617","type":"workshop","day":2,"title":"Panel discussion with DYNANIC, RHIZOME, COSMIC SOUL, SOLINIDE PHOTONICS","time_start":"11:40","time_end":"12:10","room":"VAC","theme":"Advanced Computing","sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.275617.x.html","curated":false,"owner":null,"top":false,"description":null},{"id":"269464","type":"workshop","day":2,"title":"Vers l'Agentic AI : comment Avis Budget Group automatise et accélère ses process","time_start":"11:45","time_end":"12:15","room":"W2","theme":"Data & IA au service du Business","sponsor":"ORACLE","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.269464.x.html","curated":false,"owner":null,"top":false,"description":null},{"id":"273281","type":"workshop","day":2,"title":"Rex Orange - Data de qualité et contexte maîtrisé pour l'Agentic analytics","time_start":"11:45","time_end":"12:15","room":"W3","theme":"Data & IA au service du Business","sponsor":"Google Cloud","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.273281.x.html","curated":true,"owner":"C","top":false,"description":"Alors que l'agentic analytics suscite un engouement sans précédent, Orange a vu ses projets pilotes se multiplier. Pour réussir le passage à l'échelle, le groupe mise sur l'industrialisation de Data Products fiables associés à un contexte métier hautement maîtrisé, avec gouvernance sémantique et pilotage FinOps."},{"id":"272799","type":"workshop","day":2,"title":"Qualité et gouvernance des données à l'échelle : les parcours croisés","time_start":"11:45","time_end":"12:15","room":"W4","theme":"Gouvernance & Réglementation","sponsor":"Soda","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.272799.x.html","curated":true,"owner":"C","top":true,"description":"Deux acteurs de la data retail, deux approches complémentaires de la qualité des données. Valiuz la garantit dès l'ingestion des données de ses partenaires, en central. Les Mousquetaires l'assurent sur les données qu'ils partagent, en décentralisé. Valiuz a aidé Les Mousquetaires à choisir Soda."},{"id":"275980","type":"workshop","day":2,"title":"L'usage de l'IA agentique intégrée au processus du support IT","time_start":"11:45","time_end":"12:15","room":"W5","theme":"Data & IA au service du Business","sponsor":"CBTW","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.275980.x.html","curated":false,"owner":null,"top":false,"description":"Bedrock Streaming et CBTW partagent un retour d'expérience concret sur le déploiement d'agents IA ayant permis aux équipes support de gagner en efficacité opérationnelle, à partir d'une base de connaissance jusque-là fragmentée."},{"id":"262745","type":"conference","day":2,"title":"De la Data à la Decision : repenser le lineage à l'ère de l'IA","time_start":"11:50","time_end":"12:20","room":"C3","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262745.x.html","curated":false,"owner":null,"top":false,"description":"À l'ère de l'IA, tracer l'origine d'une donnée ne suffit plus. Il faut être capable de reconstruire la chaîne complète qui conduit à une décision : sources, transformations, versions, modèles, prompts, documents mobilisés et contexte d'exécution. Cette keynote propose de repenser le Data Lineage comme une véritable chaîne de confiance pour l'IA."},{"id":"271899","type":"conference","day":2,"title":"Adoption de l'IA par les entreprises françaises : gouvernance et réglementation","time_start":"12:05","time_end":"12:25","room":"C2","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.271899.x.html","curated":false,"owner":null,"top":false,"description":"L'intelligence artificielle peut transformer en profondeur nos systèmes économiques, sociaux, technologiques, énergétiques et environnementaux. À partir des travaux de la Commission supérieure du numérique et des postes (CSNP), M. Damien MICHALLET proposera une lecture prospective à travers trois scénarios d'évolution à l'horizon 2031."},{"id":"275428","type":"workshop","day":2,"title":"Données, IA et excellence : le pari de John Paul avec ThoughtSpot","time_start":"12:20","time_end":"12:50","room":"W1","theme":"Data & IA au service du Business","sponsor":"ThoughtSpot","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.275428.x.html","curated":true,"owner":"C","top":false,"description":"Déployé en quelques semaines, ThoughtSpot accompagne John Paul dans le monitoring de ses métiers d'excellence. Grâce à l'IA conversationnelle, l'ensemble des collaborateurs accède à des réponses chiffrées, expliquées et visualisées, sans écrire une seule ligne de SQL."},{"id":"274615","type":"workshop","day":2,"title":"L'analyse augmentée de données avec une IA souveraine","time_start":"12:20","time_end":"12:50","room":"W2","theme":"Data & IA au service du Business","sponsor":"DIGDASH","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.274615.x.html","curated":false,"owner":null,"top":false,"description":"Après l'effet de nouveauté de l'Intelligence Artificielle, place aux choix stratégiques : architecture, maîtrise des données et indépendance technologique. Découvrez comment intégrer, voire industrialiser l'IA à votre architecture existante tout en garantissant performance, sécurité et gouvernance."},{"id":"275628","type":"workshop","day":2,"title":"Piloter par la Data et l'IA : comment le PMO IT accélère la livraison","time_start":"12:20","time_end":"12:50","room":"W3","theme":"Architecture Data Moderne","sponsor":"Smartsheet","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.275628.x.html","curated":false,"owner":null,"top":false,"description":"Dans un contexte où 90% des organisations font face à une pénurie de compétences IT, le rôle du PMO IT ne peut plus se limiter au reporting manuel. Cet atelier démontre comment transformer le pilotage de portefeuille de projets IT en moteur de valeur business grâce à la convergence Data et IA."},{"id":"274572","type":"workshop","day":2,"title":"Big Data, solution pour les milieux ruraux","time_start":"12:55","time_end":"13:05","room":"W1","theme":"Data & IA au service du Business","sponsor":"REAMTECH","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.274572.x.html","curated":false,"owner":null,"top":false,"description":null},{"id":"274616","type":"workshop","day":2,"title":"MatR","time_start":"12:55","time_end":"13:05","room":"W2","theme":"Data & IA au service du Business","sponsor":"MatR","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.274616.x.html","curated":false,"owner":null,"top":false,"description":null},{"id":"274620","type":"workshop","day":2,"title":"Stop your AI Agent from Hallucinating: Build a Knowledge Graph AI can Trust","time_start":"12:55","time_end":"13:05","room":"W3","theme":"Architecture Data Moderne","sponsor":"Lettria","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.274620.x.html","curated":false,"owner":null,"top":false,"description":"Vector search made RAG easy, it also made it unreliable. Dans cet atelier hands-on, construisez la couche manquante entre données d'entreprise et IA : un knowledge graph piloté par ontologie, où chaque réponse trace jusqu'à sa source."},{"id":"276272","type":"workshop","day":2,"title":"Vous avez déployé l'IA. Savez-vous ce qu'elle vous rapporte ?","time_start":"12:55","time_end":"13:05","room":"W4","theme":"Data & IA au service du Business","sponsor":"IDUN GROUP","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.276272.x.html","curated":false,"owner":null,"top":false,"description":"Vos équipes utilisent déjà Claude, Copilot, ChatGPT et vos agents internes. Vos tableaux de bord vous disent qui s'est connecté, pas quels usages existent vraiment ni lesquels rapportent. Au moins 30% des projets IA sont abandonnés après le pilote (Gartner), plus de 80% n'ont aucun effet mesurable sur le résultat (McKinsey)."},{"id":"272796","type":"workshop","day":2,"title":"Sovereign AI, Minus the Sticker Price: The Architecture the Hyperscalers Can't Sell","time_start":"12:55","time_end":"13:05","room":"W5","theme":"Gouvernance & Réglementation","sponsor":"GLBNXT B.V.","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.272796.x.html","curated":false,"owner":null,"top":false,"description":"Most European enterprises rolled out AI faster than their IT teams could keep up. Under the US CLOUD Act, a hyperscaler with a datacenter in Frankfurt can still be forced to hand over your data. GLBNXT ships an EU-owned, LLM-agnostic AI platform with compliance operations built in, not left as homework."},{"id":"273278","type":"workshop","day":2,"title":"IA locale, Cloud sélectif : accélérer les décisions métier","time_start":"13:10","time_end":"13:20","room":"W1","theme":"Data & IA au service du Business","sponsor":"Sweeft","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.273278.x.html","curated":false,"owner":null,"top":false,"description":"L'essor de l'intelligence artificielle transforme profondément les architectures data. À travers une architecture hybride combinant IA locale et Cloud sélectif, Sweeft propose une approche où chaque traitement est exécuté au niveau le plus pertinent."},{"id":"273285","type":"workshop","day":2,"title":"PME & IA : Histoires vécues","time_start":"13:10","time_end":"13:20","room":"W2","theme":"Data & IA au service du Business","sponsor":"YAKADATA","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.273285.x.html","curated":false,"owner":null,"top":false,"description":"Présentation de réussites et échecs d'utilisation de l'IA dans les TPE/PME et explication des leçons à tirer de ces histoires concrètes du terrain."},{"id":"273135","type":"workshop","day":2,"title":"Datafari – une solution souveraine pour intéragir avec les documents internes","time_start":"13:10","time_end":"13:20","room":"W3","theme":"Data & IA au service du Business","sponsor":"FRANCE LABS DATAFARI","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.273135.x.html","curated":false,"owner":null,"top":false,"description":"Datafari permet un accès centralisé et sécurisé à l'ensemble des connaissances d'une organisation. Les collaborateurs retrouvent et échangent avec les documents auxquels ils ont accès dans le SI, ou génèrent des rapports grâce à l'agentic."},{"id":"274622","type":"workshop","day":2,"title":"De la Data à la décision : l'IA d'EURODECISION au service de la performance","time_start":"13:10","time_end":"13:20","room":"W4","theme":"Data & IA au service du Business","sponsor":"EURODECISION","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.274622.x.html","curated":false,"owner":null,"top":false,"description":"Gérald Petitjean, directeur de l'Innovation d'EURODECISION, présentera comment EURODECISION accompagne les entreprises dans l'exploitation et la valorisation de leurs données, en structurant une feuille de route IA réaliste tenant compte de la souveraineté numérique et de l'adoption par les équipes."},{"id":"274378","type":"workshop","day":2,"title":"Humain & Organisation: Repenser les talents, Transformer l'organisation","time_start":"13:10","time_end":"13:20","room":"W5","theme":"Data & IA au service du Business","sponsor":"MindEssentia","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.274378.x.html","curated":false,"owner":null,"top":false,"description":"84% des entreprises ont déployé l'IA sans redessiner ni leurs rôles ni leur operating model (Deloitte, 2026). En 10 minutes, comment repenser les talents et redessiner l'organisation dans un même mouvement, avec un diagnostic, une feuille de route et une mesure d'impact."},{"id":"272890","type":"workshop","day":2,"title":"Certifier chaque décision : l'IA gouvernée au service du business","time_start":"13:25","time_end":"13:35","room":"W1","theme":"Data & IA au service du Business","sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.272890.x.html","curated":false,"owner":null,"top":false,"description":"La plupart des organisations utilisent déjà l'IA dans leurs rituels de décision, mais ces décisions restent difficiles à tracer et à défendre. NEXA Forward transforme ces rituels en décisions certifiées : chaque résultat est livré avec sa preuve — sources, lineage, règles appliquées — et validé par un expert humain (Human-in-the-Loop)."},{"id":"272535","type":"workshop","day":2,"title":"L'IA au service de la performance énergétique des bâtiments","time_start":"13:25","time_end":"13:35","room":"W2","theme":"Data & IA au service du Business","sponsor":"BNBxTECH","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.272535.x.html","curated":false,"owner":null,"top":false,"description":"Comment un agent IA transforme les données CVC/HVAC en recommandations actionnables pour réduire les consommations, anticiper les dérives et améliorer la performance énergétique des bâtiments."},{"id":"273855","type":"workshop","day":2,"title":"Comment passer à l'échelle son adoption IA et éviter l'inaction","time_start":"13:25","time_end":"13:35","room":"W3","theme":"Data & IA au service du Business","sponsor":"AI Partners","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.273855.x.html","curated":false,"owner":null,"top":false,"description":"La plupart des grandes organisations ont lancé leurs premiers projets d'IA, peu ont réussi à les industrialiser. Ce workshop s'adresse aux dirigeants et responsables data qui veulent transformer l'expérimentation en déploiement réel, à partir de cas concrets menés chez L'Oréal, ISAGRI ou Club Med."},{"id":"274623","type":"workshop","day":2,"title":"Souveraineté et IA hybride : déployer l'IA à grande échelle sans perdre le contrôle","time_start":"13:25","time_end":"13:35","room":"W4","theme":"Architecture Data Moderne","sponsor":"HPDIA","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.274623.x.html","curated":false,"owner":null,"top":false,"description":"Et si la souveraineté ne signifiait pas renoncer à la performance ? Découvrez comment une approche hybride permet de garder le contrôle sur ses données, tout en préservant la puissance et les possibilités de déploiement de l'IA."},{"id":"275629","type":"workshop","day":2,"title":"NuExtract: Specialized AI for Document Extraction","time_start":"13:25","time_end":"13:35","room":"W5","theme":"Architecture Data Moderne","sponsor":"NUMIND AI","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.275629.x.html","curated":false,"owner":null,"top":false,"description":"Accurately extracting information from documents is key to automating business processes. NuExtract is a compact LLM designed specifically for document extraction, outperforming general-purpose models while remaining small enough for on-premises deployment."},{"id":"271512","type":"workshop","day":2,"title":"Service client augmenté par l'IA : automatiser sans dégrader l'expérience","time_start":"13:40","time_end":"14:10","room":"W3","theme":"Data & IA au service du Business","sponsor":"Galadrim","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.271512.x.html","curated":false,"owner":null,"top":false,"description":"Répondre plus vite, sans dégrader l'expérience ni exploser les coûts : l'IA générative peut aujourd'hui traiter une grande partie de vos demandes clients. Pierre-Antoine Dornic, Head of GenAI de Galadrim, détaille l'architecture d'un système IA : chatbot autonome, copilote pour conseillers, garde-fous pour fiabilité et escalade humaine."},{"id":"262659","type":"conference","day":2,"title":"Vers une Supply Chain autonome – Comment l'IA change les règles du jeu","time_start":"14:00","time_end":"14:25","room":"C1","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262659.x.html","curated":false,"owner":null,"top":false,"description":"Aujourd'hui, nos Supply Chains font face à une complexité sans précédent : crises géopolitiques, volatilité de la demande, pression sur les coûts et les délais. L'intelligence artificielle change profondément la donne : on passe d'une Supply Chain réactive à une Supply Chain prédictive, puis prescriptive."},{"id":"262721","type":"conference","day":2,"title":"Maîtriser l'empreinte environnementale de l'IA - s'engager pour une IA frugale","time_start":"14:00","time_end":"14:25","room":"C2","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262721.x.html","curated":false,"owner":null,"top":false,"description":"L'empreinte environnementale des systèmes d'IA croît de façon exponentielle ces dernières années. Cette keynote donnera de grands repères sur l'empreinte environnementale de l'IA, les leviers d'action de l'IA frugale, et le déploiement opérationnel d'une démarche IA frugale au sein d'une grande ESN."},{"id":"262746","type":"conference","day":2,"title":"Sécurité de l'IA agentique et la détection de faille des agents","time_start":"14:00","time_end":"14:35","room":"C3","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262746.x.html","curated":true,"owner":"F","top":true,"description":null},{"id":"274655","type":"workshop","day":2,"title":"Club DS&AI Grand Format – IA pour l'industrie automobile","time_start":"14:00","time_end":"16:00","room":"W5","theme":"Data & IA au service du Business","sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.274655.x.html","curated":false,"owner":null,"top":false,"description":"Systematic Paris-Region, en partenariat avec le Grand Prix ACF AutoTech, propose une édition consacrée à l'IA pour l'industrie automobile : IA de confiance, cybersécurité des systèmes embarqués, suivi intelligent du conducteur, conception assistée par IA."},{"id":"274574","type":"workshop","day":2,"title":"CIKISI","time_start":"14:15","time_end":"14:45","room":"W1","theme":"Data & IA au service du Business","sponsor":"Cikisi","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.274574.x.html","curated":false,"owner":null,"top":false,"description":null},{"id":"271299","type":"workshop","day":2,"title":"Comment la Métropole du Grand Paris met en œuvre l'IA au service de son territoire","time_start":"14:15","time_end":"14:45","room":"W3","theme":"Data & IA au service du Business","sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.271299.x.html","curated":false,"owner":null,"top":false,"description":"Cet atelier sera l'occasion de présenter la stratégie IA de la Métropole du Grand Paris, son programme ApproprIAtion Métropolitaine ainsi que le partenariat structurant mis en place avec le Hub France IA."},{"id":"275430","type":"workshop","day":2,"title":"L'IA ne manque pas de puissance. Qui en captera la valeur ?","time_start":"14:15","time_end":"14:45","room":"W4","theme":"Data & IA au service du Business","sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.275430.x.html","curated":false,"owner":null,"top":false,"description":"Agents, modèles ouverts, FinOps, souveraineté : quand acheter, assembler ou construire pour garder la maîtrise."},{"id":"262665","type":"conference","day":2,"title":"IA pour la recherche médicale et la santé : promesses, réalités et retours d'expérience","time_start":"14:25","time_end":"14:50","room":"C1","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262665.x.html","curated":false,"owner":null,"top":false,"description":null},{"id":"262693","type":"conference","day":2,"title":"Décentralisation gouvernée : comment remettre le métier au centre de la donnée","time_start":"14:25","time_end":"14:50","room":"C2","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262693.x.html","curated":false,"owner":null,"top":false,"description":null},{"id":"272797","type":"conference","day":2,"title":"Ancrer l'IA dans le monde physique grâce aux World Models","time_start":"14:35","time_end":"15:10","room":"C3","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.272797.x.html","curated":false,"owner":null,"top":false,"description":"Les world models forment une nouvelle classe de modèles d'IA. Contrairement aux LLM, qui apprennent des corrélations entre mots à partir de texte, les world models apprennent sur des séquences d'observations couplées aux actions qui les ont produites, ce qui leur permet de construire une représentation causale du monde."},{"id":"262655","type":"conference","day":2,"title":"Réconcilier IA et environnement : optimiser l'eau tout en réduisant l'empreinte","time_start":"14:50","time_end":"15:15","room":"C1","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262655.x.html","curated":false,"owner":null,"top":false,"description":"Face aux tensions croissantes sur la ressource en eau, l'IA offre de nouvelles capacités pour anticiper, optimiser et mieux piloter sa gestion. Mais l'IA est elle-même consommatrice d'eau, d'énergie et de ressources. Comment concilier ces deux réalités ? Cette keynote explore les conditions d'un usage de l'IA à la fois performant, utile et soutenable."},{"id":"262723","type":"conference","day":2,"title":"Structurer efficacement son Data office : la clé pour alimenter l'innovation","time_start":"14:50","time_end":"15:15","room":"C2","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262723.x.html","curated":false,"owner":null,"top":false,"description":"Vous structurez un Data Office ? Vous en pilotez un ? À travers son retour d'expérience au sein du Groupe SNCF, Angelique, CDO du Groupe SNCF et de la Holding SNCF, partage les principes clefs pour mettre en place un Data Office en véritable accélérateur de décision et d'innovation."},{"id":"274575","type":"workshop","day":2,"title":"DATADOG","time_start":"14:50","time_end":"15:20","room":"W1","theme":"Data & IA au service du Business","sponsor":"Datadog","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.274575.x.html","curated":true,"owner":"F","top":false,"description":null},{"id":"276057","type":"workshop","day":2,"title":"Comment l'Open Data peut vous aider à mieux connaître vos clients… et à qualifier vos prospects","time_start":"14:50","time_end":"15:20","room":"W4","theme":"Data & IA au service du Business","sponsor":"OpenKey","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.276057.x.html","curated":false,"owner":null,"top":false,"description":"Vos données clients ont plus de valeur que vous ne l'imaginez. Découvrez comment l'Open Data peut révéler de nouveaux insights sur vos clients, affiner vos segmentations et mieux scorer et qualifier vos prospects."},{"id":"276273","type":"workshop","day":2,"title":"Interrogez vos données : de la question à l'analyse et à la visualisation","time_start":"14:50","time_end":"15:20","room":"W4","theme":"Data & IA au service du Business","sponsor":"SEV7N","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.276273.x.html","curated":true,"owner":"C","top":false,"description":null},{"id":"262749","type":"conference","day":2,"title":"Agents de code : productivité, contrôle qualité et nouveaux risques pour les équipes IT","time_start":"15:10","time_end":"15:40","room":"C3","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262749.x.html","curated":true,"owner":"F","top":true,"description":null},{"id":"262668","type":"conference","day":2,"title":"De la digitalisation à l'intelligence énergétique : comment l'IA transforme le secteur","time_start":"15:15","time_end":"15:40","room":"C1","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262668.x.html","curated":false,"owner":null,"top":false,"description":"Depuis plus d'une décennie, les organisations investissent massivement dans la digitalisation de leurs activités. Aujourd'hui, le véritable enjeu consiste à transformer ces données en intelligence. Yoann Bersihand, VP AI Technology chez Schneider Electric, présentera comment l'IA transforme la gestion de l'énergie, les opérations industrielles, les infrastructures et les processus d'ingénierie."},{"id":"262725","type":"conference","day":2,"title":"Sans data gouvernée, pas d'IA fiable : organiser ses données pour passer à l'échelle","time_start":"15:15","time_end":"15:40","room":"C2","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262725.x.html","curated":false,"owner":null,"top":false,"description":"À mesure que les organisations accélèrent l'adoption de l'IA, une conviction s'impose : sans données de confiance, il ne peut y avoir d'IA fiable. Ce retour d'expérience mettra en lumière les fondations indispensables à un passage à l'échelle : gouvernance, qualité des données, couche sémantique et architectures data modernes."},{"id":"274617","type":"workshop","day":2,"title":"BLOOMFLOW","time_start":"15:25","time_end":"15:55","room":"W2","theme":"Data & IA au service du Business","sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.274617.x.html","curated":false,"owner":null,"top":false,"description":null},{"id":"275427","type":"workshop","day":2,"title":"Usine agentique : comment orchestrer des agents IA pour accélérer la production","time_start":"15:25","time_end":"15:55","room":"W3","theme":"Data & IA au service du Business","sponsor":"Theodo","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.275427.x.html","curated":true,"owner":"F","top":false,"description":"Et si une équipe d'agents IA tournait en continu, remplaçant l'artisanat risqué par une chaîne industrielle pilotée par la valeur ? Ce REX présente l'usine agentique chez Pernod Ricard : réécriture d'un monolithe AngularJS de 10 ans, passage de 9 à 77 affiliés, 10x plus vite qu'une réécriture manuelle."},{"id":"262658","type":"conference","day":2,"title":"Passer à l'échelle avec l'IA : piloter la transformation, gouverner les usages","time_start":"15:40","time_end":"16:05","room":"C1","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262658.x.html","curated":false,"owner":null,"top":false,"description":"Chez Bpifrance, l'ambition de faire de l'IA un véritable levier de transformation s'appuie sur principe fondateur : la valeur de l'IA se nourrit de la valeur de la donnée. Gouvernée, fiable, et contextualisée, la donnée devient une véritable ressource stratégique au service de l'innovation, de la performance et de la trajectoire IA."},{"id":"262722","type":"conference","day":2,"title":"Model Risk Management : identifier, mesurer et piloter les risques des modèles d'IA","time_start":"15:40","time_end":"16:05","room":"C2","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262722.x.html","curated":false,"owner":null,"top":false,"description":"Face à l'intensification des menaces cyber, aux instabilités géopolitiques et à l'accélération des usages d'IA, la maîtrise des risques liés aux Systèmes d'Intelligence Artificielle devient un enjeu stratégique majeur. Cette session montrera pourquoi la conformité ne suffit plus."},{"id":"262750","type":"conference","day":2,"title":"La science des données avec des agents IA","time_start":"15:40","time_end":"16:00","room":"C3","theme":null,"sponsor":null,"url":"https://www.bigdataparis.com/fr-fr/programme/conferences/session-details.4904.262750.x.html","curated":true,"owner":"C","top":true,"description":"Your AI agent writes the scikit-learn pipeline; skore is the harness that validates it works — detecting data leakage, picking the right metric per fold, flagging silent overfitting. By the founders of scikit-learn, Probabl raised 18.5 millions in seed and aims to bring scientific rigor to the AI transformation of Data Science."},{"id":"264936","type":"workshop","day":2,"title":"L'IA comme interface : Vers une comptabilité pilotée par la donnée et l'agentique","time_start":"16:00","time_end":"16:30","room":"W1","theme":"Data & IA au service du Business","sponsor":"Myunisoft","url":"https://www.bigdataparis.com/fr-fr/programme/demo-sessions/session-details.4905.264936.x.html","curated":false,"owner":null,"top":false,"description":"Pendant des décennies, les logiciels comptables ont été conçus pour les machines. Aujourd'hui, face à l'explosion des flux de données (RFE, PDP, API), ce modèle arrive à ses limites. Cette agora propose de repenser radicalement notre métier : comment l'Intelligence Artificielle transforme l'interface en langage naturel et fait passer le collaborateur du rôle d'exécutant technique à celui de pilote de workflows."}]</script>

<script>
(function(){
'use strict';

/* ---------- données ---------- */
var SESSIONS = JSON.parse(document.getElementById('sessions-data').textContent);
var BY_ID = {};
SESSIONS.forEach(function(s){ s.id = String(s.id); BY_ID[s.id] = s; });

var DAYS = {
  1:{label:'Jour 1', date:'mardi 15 septembre 2026'},
  2:{label:'Jour 2', date:'mercredi 16 septembre 2026'}
};
var PROFILES = {
  F:{name:'Florian', key:'selection_florian', initial:'F'},
  C:{name:'Coline',  key:'selection_coline',  initial:'C'}
};
var OWNER_LABEL = {
  F:'Recommandé pour Florian',
  C:'Recommandé pour Coline',
  B:'Recommandé pour vous deux'
};
var ROOM_LABEL = { VAC:'Village Advanced Computing' };

/* badges d'entrée embarqués (image + numéro), un par profil */
var BADGES = (function(){
  try{ return JSON.parse(document.getElementById('badges-data').textContent); }
  catch(e){ return {}; }
})();

/* ---------- état ---------- */
var profile = null;
var view = '1';
var filters = { conference:false, workshop:false, curated:false };
var sel = { F:[], C:[] };
var shared = { F:null, C:null };   /* planning recu de l'autre profil, lecture seule */
var openId = null;
var pendingCode = null;            /* code detecte dans l'URL, en attente du choix de profil */

/* ---------- stockage ---------- */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

function loadSel(p){
  var raw = lsGet(PROFILES[p].key);
  if(!raw) return [];
  try{
    var a = JSON.parse(raw);
    if(!Array.isArray(a)) return [];
    return a.map(String).filter(function(id){ return BY_ID[id]; });
  }catch(e){ return []; }
}
function saveSel(p){ lsSet(PROFILES[p].key, JSON.stringify(sel[p])); }

/* ---------- partage : encodage compact ---------- */
/* Une selection = un masque de bits sur l'ordre canonique des ids.
   180 sessions -> 23 octets, + 1 octet de version + 2 octets d'empreinte
   du jeu de donnees = 26 octets, soit un code de 35 caracteres, quelle
   que soit la taille de la selection. */
var CANON = SESSIONS.map(function(s){ return s.id; }).sort();
var CANON_IX = {};
CANON.forEach(function(id, i){ CANON_IX[id] = i; });
var NBYTES = Math.ceil(CANON.length / 8);
var CODE_V = 1;
var FP = (function(){
  var s = CANON.join(','), h = 0;
  for(var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return h & 0xFFFF;
})();

function b64e(bytes){
  var s = '';
  for(var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64d(str){
  str = String(str).replace(/-/g, '+').replace(/_/g, '/');
  while(str.length % 4) str += '=';
  var s = atob(str), out = new Uint8Array(s.length);
  for(var i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
  return out;
}

function encodeSel(p){
  var bytes = new Uint8Array(3 + NBYTES);
  bytes[0] = CODE_V;
  bytes[1] = (FP >> 8) & 255;
  bytes[2] = FP & 255;
  sel[p].forEach(function(id){
    var ix = CANON_IX[id];
    if(ix == null) return;
    bytes[3 + (ix >> 3)] |= 1 << (ix & 7);
  });
  return p + '.' + b64e(bytes);
}

/* accepte un code nu ou un lien complet colle */
function decodeCode(raw){
  var txt = String(raw == null ? '' : raw).trim();
  if(!txt) return { err:'Colle le code reçu dans le champ ci-dessus.' };
  var m = txt.match(/(?:^|[#?&/=\s])([FC])\.([A-Za-z0-9_-]{8,})\s*$/);
  if(!m) return { err:'Code non reconnu. Vérifie que tu as bien copié le texte en entier.' };
  var bytes;
  try{ bytes = b64d(m[2]); }
  catch(e){ return { err:'Code illisible — la copie semble incomplète.' }; }
  if(bytes.length !== 3 + NBYTES || bytes[0] !== CODE_V){
    return { err:'Code illisible — la copie semble incomplète.' };
  }
  if((((bytes[1] << 8) | bytes[2]) & 0xFFFF) !== FP){
    return { err:'Ce code a été généré depuis une autre version du programme. Utilisez tous les deux le même fichier.' };
  }
  var ids = [];
  for(var ix = 0; ix < CANON.length; ix++){
    if(bytes[3 + (ix >> 3)] & (1 << (ix & 7))) ids.push(CANON[ix]);
  }
  return { from:m[1], ids:ids };
}

function sharedKey(from){ return 'shared_from_' + (from === 'F' ? 'florian' : 'coline'); }
function loadShared(from){
  var raw = lsGet(sharedKey(from));
  if(!raw) return null;
  try{
    var o = JSON.parse(raw);
    var ids = Array.isArray(o && o.ids) ? o.ids.map(String).filter(function(id){ return BY_ID[id]; }) : [];
    return ids.length ? { ids:ids, at:o.at || null } : null;
  }catch(e){ return null; }
}
function saveShared(from, ids){
  lsSet(sharedKey(from), JSON.stringify({ v:CODE_V, ids:ids, at:Date.now() }));
  shared[from] = { ids:ids, at:Date.now() };
}
function dropShared(from){
  try{ localStorage.removeItem(sharedKey(from)); }catch(e){}
  shared[from] = null;
}
function sharedIds(){ var s = shared[other()]; return s ? s.ids : []; }
function whenStr(ts){
  if(!ts) return '';
  var d = new Date(ts);
  return d.toLocaleDateString('fr-FR', { day:'numeric', month:'long' })
    + ' à ' + d.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
}
/* lien complet seulement si l'app est servie en http(s) : un lien file:// n'est
   pas cliquable depuis une messagerie */
function shareLink(code){
  if(location.protocol !== 'http:' && location.protocol !== 'https:') return null;
  return location.origin + location.pathname + '#p=' + code;
}

/* ---------- utilitaires ---------- */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
  });
}
function mins(t){ var p = String(t || '').split(':'); return (+p[0] || 0) * 60 + (+p[1] || 0); }
function isSel(p, id){ return sel[p].indexOf(id) !== -1; }
/* l'autre y va aussi : soit il a son profil sur ce telephone, soit il a partage son planning */
function otherHas(id){ return isSel(other(), id) || sharedIds().indexOf(id) !== -1; }
function other(){ return profile === 'F' ? 'C' : 'F'; }
function roomFull(r){ return ROOM_LABEL[r] || ('Salle ' + r); }
function typeLabel(t){ return t === 'conference' ? 'Conférence' : 'Workshop'; }
function plural(n, w){ return n + ' ' + w + (n > 1 ? 's' : ''); }

/* ---------- filtrage / tri ---------- */
function dayList(day){
  var typeOn = filters.conference || filters.workshop;
  return SESSIONS.filter(function(s){
    if(s.day !== day) return false;
    if(filters.curated && !s.curated) return false;
    if(typeOn && !filters[s.type]) return false;
    return true;
  }).sort(function(a, b){
    return mins(a.time_start) - mins(b.time_start)
        || (b.curated ? 1 : 0) - (a.curated ? 1 : 0)
        || String(a.room).localeCompare(String(b.room));
  });
}
function mySessions(day){
  return SESSIONS.filter(function(s){
    return s.day === day && isSel(profile, s.id);
  }).sort(function(a, b){
    return mins(a.time_start) - mins(b.time_start) || String(a.room).localeCompare(String(b.room));
  });
}
/* sessions déjà sélectionnées par le profil actif qui chevauchent s (même jour) */
function clashes(s){
  var a1 = mins(s.time_start), a2 = mins(s.time_end);
  return SESSIONS.filter(function(o){
    if(o.id === s.id || o.day !== s.day || !isSel(profile, o.id)) return false;
    return mins(o.time_start) < a2 && a1 < mins(o.time_end);
  });
}

/* ---------- rendu ---------- */
function tagsHTML(s, long){
  return '<span class="tag ' + (s.type === 'conference' ? 'conf' : 'ws') + '">' + typeLabel(s.type) + '</span>'
    + '<span class="tag room">' + esc(s.room) + '</span>'
    + (s.top ? '<span class="tag star">★★★' + (long ? ' Priorité' : '') + '</span>'
             : (s.curated ? '<span class="tag rec">★ Reco' + (long ? 'mmandé' : '') + '</span>' : ''));
}

function cardHTML(s){
  var cls = ['card', 'o-' + (s.owner || 'N')];
  if(isSel(profile, s.id)) cls.push('sel');
  if(otherHas(s.id)) cls.push('other');
  return '<article class="' + cls.join(' ') + '" data-id="' + esc(s.id) + '">'
    + '<button class="card-main" data-act="open">'
      + '<span class="meta">' + tagsHTML(s, false) + '</span>'
      + '<h3>' + esc(s.title) + '</h3>'
      + (s.sponsor ? '<div class="spons">par <b>' + esc(s.sponsor) + '</b></div>' : '')
      + '<div class="hours">' + esc(s.time_start) + ' – ' + esc(s.time_end) + '</div>'
    + '</button>'
    + '<button class="card-check" data-act="toggle" aria-pressed="' + (isSel(profile, s.id) ? 'true' : 'false')
      + '" aria-label="Ajouter à mon planning"><span class="box">✓</span><span class="dot"></span></button>'
  + '</article>';
}

function renderDay(day){
  var list = dayList(day);
  document.getElementById('count').innerHTML = '<b>' + list.length + '</b>session' + (list.length > 1 ? 's' : '');
  var main = document.getElementById('list');

  if(!list.length){
    main.innerHTML = '<div class="empty"><div class="ico">🔍</div>'
      + '<p>Aucune session avec ces filtres</p>'
      + '<small>Désactive un filtre pour élargir la recherche.</small></div>';
    return;
  }

  var out = [], i = 0;
  while(i < list.length){
    var t = list[i].time_start, group = [];
    while(i < list.length && list[i].time_start === t){ group.push(list[i]); i++; }
    out.push('<div class="slot">'
      + '<div class="slot-time"><b>' + esc(t) + '</b>'
        + (group.length > 1 ? '<i>' + group.length + ' sess.</i>' : '') + '</div>'
      + '<div class="slot-rail"></div>'
      + '<div class="slot-cards">' + group.map(cardHTML).join('') + '</div>'
    + '</div>');
  }
  main.innerHTML = out.join('');
}

function renderPlanning(){
  var box = document.getElementById('planning');
  var total = sel[profile].length;

  var actions = '<div class="pl-actions">'
    + '<button class="btn pri" data-share="open">Partager mon planning</button>'
    + '</div>';

  if(!total){
    box.innerHTML = '<div class="empty"><div class="ico">🗓️</div>'
      + '<p>Ton planning est vide</p>'
      + '<small>Dans Jour 1 ou Jour 2, touche la case ✓ à droite d\'une session pour l\'ajouter ici.</small>'
      + '<div style="max-width:280px;margin:18px auto 0">'
        + '<button class="btn" data-share="open">Importer un planning reçu</button></div>'
      + '</div>'
      + sharedHTML();
    return;
  }

  var html = '<div class="pl-head"><strong>Planning de ' + PROFILES[profile].name + '</strong>'
    + '<p>' + plural(total, 'session') + ' · itinéraire chronologique</p>'
    + actions + '</div>';

  [1, 2].forEach(function(day){
    var list = mySessions(day);
    html += '<div class="pl-day">' + DAYS[day].label
      + ' <span>· ' + DAYS[day].date + ' · ' + plural(list.length, 'session') + '</span></div>';
    if(!list.length){
      html += '<div class="pl-row none">Rien de sélectionné ce jour-là</div>';
      return;
    }
    list.forEach(function(s){
      var cl = clashes(s);
      html += '<button class="pl-row o-' + (s.owner || 'N') + '" data-id="' + esc(s.id) + '" data-act="open">'
        + '<span class="pl-t"><b>' + esc(s.time_start) + '</b><i>' + esc(s.time_end) + '</i></span>'
        + '<span class="pl-body"><h4>' + esc(s.title) + '</h4>'
        + '<em>' + esc(roomFull(s.room)) + ' · ' + typeLabel(s.type)
        + (s.sponsor ? ' · ' + esc(s.sponsor) : '') + '</em></span>'
      + '</button>';
      if(cl.length){
        html += '<div class="warn"><span>⚠</span><span>Chevauche ' + plural(cl.length, 'autre session')
          + ' de ton planning</span></div>';
      }
    });
  });
  box.innerHTML = html + sharedHTML();
}

/* planning recu de l'autre profil : lecture seule, sous le sien */
function sharedHTML(){
  var from = other(), sh = shared[from];
  if(!sh || !sh.ids.length) return '';

  var mine = sh.ids.filter(function(id){ return isSel(profile, id); }).length;
  var html = '<div class="pl-day">Planning de ' + PROFILES[from].name
    + ' <span>· ' + plural(sh.ids.length, 'session')
    + (mine ? ' · ' + mine + ' en commun' : '')
    + ' · lecture seule</span></div>';

  [1, 2].forEach(function(day){
    var list = SESSIONS.filter(function(s){
      return s.day === day && sh.ids.indexOf(s.id) !== -1;
    }).sort(function(a, b){
      return mins(a.time_start) - mins(b.time_start) || String(a.room).localeCompare(String(b.room));
    });
    if(!list.length) return;
    html += '<div class="pl-sub">' + DAYS[day].label + '</div>';
    list.forEach(function(s){
      var both = isSel(profile, s.id);
      html += '<button class="pl-row ro from-' + from + '" data-id="' + esc(s.id) + '" data-act="open">'
        + '<span class="pl-t"><b>' + esc(s.time_start) + '</b><i>' + esc(s.time_end) + '</i></span>'
        + '<span class="pl-body"><h4>' + esc(s.title) + '</h4>'
        + '<em>' + esc(roomFull(s.room)) + ' · ' + typeLabel(s.type) + '</em>'
        + (both ? '<span class="tag both">★ Vous deux</span>' : '') + '</span>'
      + '</button>';
    });
  });
  return html;
}

function render(){
  var p = PROFILES[profile];
  document.body.setAttribute('data-profile', profile);
  document.querySelector('#profBtn .av').textContent = p.initial;
  document.getElementById('profName').textContent = p.name;
  document.getElementById('badgeBtn').classList.toggle('hide', !BADGES[profile]);

  var n = sel[profile].length;
  document.querySelector('.tab[data-v="p"]').innerHTML = 'Mon planning'
    + (n ? '<span class="badge">' + n + '</span>' : '')
    + '<small>' + (n ? plural(n, 'session') : 'vide') + '</small>';

  document.querySelectorAll('.tab').forEach(function(t){
    t.setAttribute('aria-selected', t.dataset.v === view ? 'true' : 'false');
  });
  document.querySelectorAll('.chip').forEach(function(c){
    c.setAttribute('aria-pressed', filters[c.dataset.f] ? 'true' : 'false');
  });

  var isPl = view === 'p';
  document.getElementById('filters').classList.toggle('hide', isPl);
  document.getElementById('list').hidden = isPl;
  document.getElementById('planning').hidden = !isPl;

  if(isPl) renderPlanning(); else renderDay(+view);
  if(openId) syncSheetBtn();
  measure();
}

/* ---------- sélection + conflits ---------- */
var toastT = null;
function toast(html, icon){
  var el = document.getElementById('toast');
  el.innerHTML = '<span class="ti">' + (icon || '⚠') + '</span><span>' + html + '</span>';
  el.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(function(){ el.classList.remove('on'); }, 5500);
}

function toggle(id){
  var s = BY_ID[id];
  if(!s) return;
  var arr = sel[profile], i = arr.indexOf(id);
  if(i === -1){
    var cl = clashes(s);            /* avant ajout : la session elle-même est exclue */
    arr.push(id);
    saveSel(profile);
    if(cl.length){
      toast('Chevauche <b>' + esc(cl[0].title) + '</b>'
        + (cl.length > 1 ? ' et ' + plural(cl.length - 1, 'autre') : '')
        + ' — les deux restent sélectionnées.');
    }
  }else{
    arr.splice(i, 1);
    saveSel(profile);
  }
  render();
}

/* ---------- fiche de partage ---------- */
function shareMsg(txt, kind){
  var el = document.getElementById('shareMsg');
  if(el) el.className = 'msg ' + (kind || 'inf'), el.textContent = txt;
}
function importMsg(txt, kind){
  var el = document.getElementById('importMsg');
  if(el) el.className = 'msg ' + (kind || 'inf'), el.textContent = txt;
}

function copyText(txt, ok){
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = txt;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    document.body.appendChild(ta);
    ta.select();
    try{ ta.setSelectionRange(0, txt.length); }catch(e){}
    var done = false;
    try{ done = document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
    shareMsg(done ? ok : 'Copie automatique refusée par le navigateur — sélectionne le code à la main.', done ? 'ok' : 'err');
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ shareMsg(ok, 'ok'); }, fallback);
  }else{
    fallback();
  }
}

function renderShare(prefill){
  var me = PROFILES[profile], from = other(), him = PROFILES[from];
  var n = sel[profile].length;
  var code = n ? encodeSel(profile) : null;
  var link = code ? shareLink(code) : null;

  var h = '<div class="sec"><h3>Envoyer mon planning à ' + him.name + '</h3>';
  if(!n){
    h += '<p>Ton planning est vide : sélectionne au moins une session avant de le partager.</p>';
  }else{
    h += '<p>' + plural(n, 'session') + '. '
      + (link
          ? 'Envoie-lui le lien : il ouvre l’app directement sur ton planning.'
          : 'Envoie-lui ce code par message. Elle le collera dans son app, section ci-dessous.')
      + '</p>';
    h += '<textarea class="code" id="shareCode" readonly rows="2">' + esc(link || code) + '</textarea>';
    h += '<div class="btnrow">'
      + '<button class="btn pri" data-share="copy">Copier</button>'
      + (navigator.share ? '<button class="btn" data-share="send">Envoyer…</button>' : '')
      + '</div>';
    if(link){
      h += '<p class="share-note" style="margin-top:9px">Le code seul, si elle préfère le coller à la main :<br>'
        + '<span style="font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600;word-break:break-all">'
        + esc(code) + '</span></p>';
    }
    h += '<p class="msg inf" id="shareMsg">Ce code décrit uniquement ta sélection — il ne t’identifie pas et ne part sur aucun serveur.</p>';
  }
  h += '</div>';

  h += '<div class="sec"><h3>Recevoir le planning de ' + him.name + '</h3>';
  if(sh){
    h += '<div class="imported ' + (from === 'F' ? 'f' : 'c') + '">'
      + '<span class="av">' + him.initial + '</span>'
      + '<span>Planning de ' + him.name + ' importé'
      + '<small>' + plural(sh.ids.length, 'session') + (sh.at ? ' · le ' + whenStr(sh.at) : '') + '</small></span>'
      + '</div>';
    h += '<p>Il s’affiche en lecture seule sous ton planning. Ta sélection n’est jamais modifiée.</p>';
  }else{
    h += '<p>Colle ici le code qu’' + (from === 'F' ? 'il' : 'elle') + ' t’a envoyé.</p>';
  }
  h += '<textarea class="code" id="importCode" rows="2" placeholder="Colle le code ou le lien reçu ici" spellcheck="false" autocapitalize="off" autocorrect="off">'
    + esc(prefill || '') + '</textarea>';
  h += '<div class="btnrow">'
    + '<button class="btn pri" data-share="import">' + (sh ? 'Mettre à jour' : 'Importer') + '</button>'
    + (sh ? '<button class="btn dgr" data-share="forget">Retirer</button>' : '')
    + '</div>';
  h += '<p class="msg inf" id="importMsg">'
    + (prefill ? 'Un planning partagé a été détecté dans le lien — touche « Importer » pour l’ajouter.' : '')
    + '</p>';
  h += '</div>';

  document.getElementById('shareBody').innerHTML = h;
  if(!prefill) importMsg('', 'inf');
}

  renderShare(prefill);
  var sh = document.getElementById('share');
  sh.style.transform = '';
  sh.classList.add('on');
  document.getElementById('scrim').classList.add('on');
  document.body.style.overflow = 'hidden';
  document.getElementById('shareBody').scrollTop = 0;
}

function doImport(){
  var ta = document.getElementById('importCode');
  var r = decodeCode(ta ? ta.value : '');
  if(r.err){ importMsg(r.err, 'err'); return; }
  if(r.from === profile){
    importMsg('Ce code est celui de ' + PROFILES[profile].name + ' — c’est ton propre planning. Demande-lui le sien.', 'err');
    return;
  }
  if(!r.ids.length){ importMsg('Ce code correspond à un planning vide.', 'err'); return; }
  saveShared(r.from, r.ids);
  render();
  renderShare('');
  importMsg('Planning de ' + PROFILES[r.from].name + ' importé : ' + plural(r.ids.length, 'session')
    + '. Il s’affiche sous le tien dans Mon planning.', 'ok');
}

/* ---------- fermeture par glissement ---------- */
function makeSwipe(sheetId, grabId){
  var sh = document.getElementById(sheetId), grab = document.getElementById(grabId);
  var y0 = null;
  function down(e){
    y0 = e.touches ? e.touches[0].clientY : e.clientY;
    sh.style.transition = 'none';
  }
  function move(e){
    if(y0 === null) return;
    var dy = (e.touches ? e.touches[0].clientY : e.clientY) - y0;
    if(dy > 0){
      sh.style.transform = 'translateY(' + dy + 'px)';
      if(e.cancelable) e.preventDefault();
    }
  }
  function up(e){
    if(y0 === null) return;
    var end = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
    var dy = end - y0;
    y0 = null;
    sh.style.transition = '';
    if(dy > 90) closeSheet(); else sh.style.transform = '';
  }
  grab.addEventListener('touchstart', down, { passive:true });
  grab.addEventListener('touchmove', move, { passive:false });
  grab.addEventListener('touchend', up);
  grab.addEventListener('mousedown', function(e){
    down(e);
    function mm(ev){ move(ev); }
    function mu(ev){ up(ev); document.removeEventListener('mousemove', mm); document.removeEventListener('mouseup', mu); }
    document.addEventListener('mousemove', mm);
    document.addEventListener('mouseup', mu);
  });
}
makeSwipe('sheet', 'shGrab');
makeSwipe('share', 'shareGrab');
makeSwipe('badge', 'badgeGrab');

/* ---------- hauteur réelle du header (offset du sticky filtres) ---------- */
function measure(){
  var h = document.querySelector('header').offsetHeight;
  document.documentElement.style.setProperty('--hdrH', h + 'px');
}

/* ---------- profil ---------- */
function setProfile(p, persist){
  profile = p;
  if(persist !== false) lsSet('activeProfile', p);
  sel.F = loadSel('F');
  sel.C = loadSel('C');
  shared.F = loadShared('F');
  shared.C = loadShared('C');
  document.getElementById('gate').classList.add('hide');
  render();
  if(pendingCode){
    var code = pendingCode;
    pendingCode = null;
    openShare(code);
  }
}
function askProfile(){
  closeSheet();
  document.getElementById('gate').classList.remove('hide');
}

/* ---------- événements ---------- */
document.getElementById('gate').addEventListener('click', function(e){
  var b = e.target.closest('[data-p]');
  if(b) setProfile(b.dataset.p);
});
document.getElementById('profBtn').addEventListener('click', askProfile);

document.querySelector('.tabs').addEventListener('click', function(e){
  var t = e.target.closest('.tab');
  if(!t) return;
  view = t.dataset.v;
  render();
  window.scrollTo(0, 0);
});

document.getElementById('chips').addEventListener('click', function(e){
  var c = e.target.closest('.chip');
  if(!c) return;
  filters[c.dataset.f] = !filters[c.dataset.f];
  render();
});

document.getElementById('app').addEventListener('click', function(e){
  var b = e.target.closest('[data-act]');
  if(!b) return;
  var host = b.closest('[data-id]');
  if(!host) return;
  if(b.dataset.act === 'toggle') toggle(host.dataset.id);
  else openSheet(host.dataset.id);
});

document.getElementById('shSel').addEventListener('click', function(){ if(openId) toggle(openId); });
document.getElementById('shClose').addEventListener('click', closeSheet);
document.getElementById('shareClose').addEventListener('click', closeSheet);
document.getElementById('badgeClose').addEventListener('click', closeSheet);
document.getElementById('badgeBtn').addEventListener('click', openBadge);
document.getElementById('scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && anySheetOpen()) closeSheet(); });
window.addEventListener('resize', measure);

/* actions de partage (boutons dans Mon planning et dans la fiche de partage) */
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-share]');
  if(!b) return;
  var a = b.dataset.share;
  if(a === 'open'){ openShare(''); return; }
  if(a === 'import'){ doImport(); return; }
  if(a === 'forget'){
    dropShared(other());
    render();
    renderShare('');
    importMsg('Planning retiré.', 'inf');
    return;
  }
  var ta = document.getElementById('shareCode');
  if(!ta) return;
  if(a === 'copy'){
    copyText(ta.value, 'Copié — envoie-le par message à ' + PROFILES[other()].name + '.');
  }else if(a === 'send' && navigator.share){
    navigator.share({
      title: 'Mon programme Big Data & AI Paris 2026',
      text: 'Voici mon planning pour le salon : ' + ta.value
    }).catch(function(){});
  }
});

/* ---------- démarrage ---------- */
/* planning partagé reçu par lien : #p=<code> */
(function(){
  var m = String(location.hash || '').match(/[#&]p=([FC]\.[A-Za-z0-9_-]{8,})/);
  if(!m) return;
  pendingCode = m[1];
  try{ history.replaceState(null, '', location.pathname + location.search); }
  catch(e){ location.hash = ''; }
})();

var saved = lsGet('activeProfile');
if(saved === 'F' || saved === 'C'){
  setProfile(saved, false);
}else{
  sel.F = loadSel('F');
  sel.C = loadSel('C');
  shared.F = loadShared('F');
  shared.C = loadShared('C');
  measure();
}

})();
</script>
